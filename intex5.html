<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบแอดมิน | สภานักเรียนโรงเรียนร้องกวางอนุสรณ์</title>
<link rel="icon" href="assets/logo-council.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/stely.css">
</head>
<body>
<header id="topbar" class="topbar" data-nav="student" data-active="intex5"></header>

<main>
<div class="login-shell">
  <form class="login-card" id="loginForm" novalidate>
    <img src="assets/logo-council.jpg" alt="ตราสภานักเรียน">
    <h1 id="title">รหัสผ่านเข้าสู่โหมด แอดมิน</h1>
    <p class="text-muted" style="font-size:.9rem;margin-bottom:0">
      สำหรับคณะกรรมการสภานักเรียนและครูที่ปรึกษาเท่านั้น
      <span class="mode-chip" id="modeChip"></span></p>

    <div class="field only-online">
      <label for="aemail">อีเมลแอดมิน</label>
      <input type="email" id="aemail" autocomplete="username" placeholder="admin@example.com">
    </div>

    <div class="field">
      <label for="pw">รหัสผ่าน</label>
      <div class="pw-wrap">
        <input type="password" id="pw" autocomplete="current-password" placeholder="ใส่รหัสผ่าน" required>
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="แสดง/ซ่อนรหัสผ่าน">แสดง</button>
      </div>
    </div>

    <div class="alert alert-err" id="errBox"></div>
    <div class="alert alert-lock" id="lockBox"></div>

    <div class="btn-row" style="justify-content:center;margin-top:20px">
      <button type="submit" class="btn btn-primary" id="loginBtn">เข้าสู่ระบบ</button>
      <a class="btn btn-ghost" href="intex1.html">กลับหน้าหลัก</a>
    </div>

    <p class="attempt-note" id="note"></p>
  </form>
</div>
</main>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
SP.boot(function () {
  var ONLINE = SP.DB && SP.DB.live();
  var form = document.getElementById('loginForm'),
      pw = document.getElementById('pw'),
      aemail = document.getElementById('aemail'),
      errBox = document.getElementById('errBox'),
      lockBox = document.getElementById('lockBox'),
      btn = document.getElementById('loginBtn'),
      note = document.getElementById('note');

  var chip = document.getElementById('modeChip');
  chip.className = 'mode-chip ' + (ONLINE ? 'mode-online' : 'mode-local');
  chip.textContent = ONLINE ? 'ออนไลน์' : 'โหมดเครื่องเดียว';

  document.querySelectorAll(ONLINE ? '.only-local' : '.only-online')
    .forEach(function (el) { el.style.display = 'none'; });

  document.getElementById('pwToggle').addEventListener('click', function () {
    pw.type = pw.type === 'password' ? 'text' : 'password';
    this.textContent = pw.type === 'password' ? 'แสดง' : 'ซ่อน';
  });

  function fail(m) { errBox.textContent = '❌ ' + m; errBox.classList.add('show'); }

  if (new URLSearchParams(location.search).get('need')) {
    fail('กรุณาเข้าสู่ระบบก่อนเข้าใช้งานหน้าแอดมิน');
  }

  /* เข้าสู่ระบบอยู่แล้ว */
  if (SP.Admin.isIn()) { location.replace('intex6.html'); return; }

  /* ================= โหมดออนไลน์ ================= */
  if (ONLINE) {
    document.getElementById('title').textContent = 'เข้าสู่ระบบแอดมิน';
    note.innerHTML = 'ใช้บัญชีแอดมินที่สร้างไว้ใน Supabase<br>' +
      '<span class="text-muted">(ถ้ายังไม่มี ดูวิธีสร้างใน README-SUPABASE.md)</span>';

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errBox.classList.remove('show');
      var em = aemail.value.trim(), p = pw.value;
      if (!SP.validEmail(em) || !p) { fail('กรุณากรอกอีเมลและรหัสผ่านให้ครบ'); return; }

      btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
      SP.DB.signIn(em, p).then(function () {
        return SP.DB.refreshRole();
      }).then(function (st) {
        if (!st.isAdmin) {
          return SP.DB.signOut().then(function () {
            throw new Error('บัญชีนี้ไม่มีสิทธิ์แอดมิน — ต้องเพิ่ม user id ลงตาราง admins ก่อน');
          });
        }
        return SP.DB.refetchAll().then(function () { location.replace('intex6.html'); });
      })['catch'](function (err) {
        btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
        pw.value = '';
        var m = String(err.message || '');
        fail(/Invalid login/i.test(m) ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : m);
      });
    });
    return;
  }

  /* ================= โหมดเครื่องเดียว ================= */
  var timer;
  function refreshLock() {
    var left = SP.Admin.lockLeft();
    if (left > 0) {
      lockBox.innerHTML = '🔒 <strong>ระบบถูกล็อก</strong><br>ใส่รหัสผ่านผิดครบ 3 ครั้ง กรุณารออีก <strong>' +
        SP.Admin.fmtLeft(left) + '</strong> จึงจะเข้าสู่ระบบได้อีกครั้ง';
      lockBox.classList.add('show');
      pw.disabled = true; btn.disabled = true;
      note.textContent = 'ปลดล็อกอัตโนมัติเมื่อครบ 1 ชั่วโมง';
      clearTimeout(timer); timer = setTimeout(refreshLock, 20000);
    } else {
      lockBox.classList.remove('show');
      pw.disabled = false; btn.disabled = false;
      var lft = SP.Admin.attemptsLeft();
      note.textContent = lft < 3
        ? 'เหลือโอกาสใส่รหัสอีก ' + lft + ' ครั้ง ก่อนระบบล็อก 1 ชั่วโมง'
        : 'ใส่รหัสผิดเกิน 3 ครั้ง ระบบจะล็อกการเข้าสู่โหมดแอดมินเป็นเวลา 1 ชั่วโมง';
    }
  }
  refreshLock();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errBox.classList.remove('show');
    var r = SP.Admin.tryLogin(pw.value);
    if (r.ok) { location.href = 'intex6.html'; return; }
    pw.value = '';
    if (r.locked) { refreshLock(); return; }
    fail('รหัสผ่านไม่ถูกต้อง เหลือโอกาสอีก ' + r.remain + ' ครั้ง');
    refreshLock(); pw.focus();
  });
});
</script>
</body>
</html>
