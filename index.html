  /* ============================================================
     3.4 คลังรูปภาพ (IndexedDB)
     ------------------------------------------------------------
     localStorage มีพื้นที่แค่ประมาณ 5 MB และเก็บรูปแบบ base64
     ซึ่งกินพื้นที่มากกว่าไฟล์จริง 33%
     ที่เก็บนี้ใช้ IndexedDB เก็บรูปเป็นไฟล์ (Blob) โดยตรง
     พื้นที่ที่ได้ขึ้นกับเบราว์เซอร์และพื้นที่ว่างในเครื่อง
     โดยทั่วไปหลักร้อย MB ถึงหลาย GB
     ------------------------------------------------------------
     ในข้อมูล เราเก็บเป็น "ref" ซึ่งเป็นได้ 2 แบบ
       • 'img...'  = รหัสรูปใน IndexedDB (แบบใหม่)
       • 'data:...' = รูปฝังในข้อมูลโดยตรง (แบบเก่า ยังอ่านได้ปกติ)
     ============================================================ */
  var Img = (function () {
    var DBNAME = 'sapara2569-images', STORE = 'images', VER = 1;
    var dbPromise = null;
    var urlCache = {};      /* ref -> objectURL (กันสร้างซ้ำ) */

    function supported() { return !!global.indexedDB; }

    function open() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise(function (res, rej) {
        if (!supported()) { rej(new Error('เบราว์เซอร์นี้ไม่รองรับ IndexedDB')); return; }
        var rq;
        try { rq = global.indexedDB.open(DBNAME, VER); }
        catch (e) { rej(e); return; }
        rq.onupgradeneeded = function () {
          var db = rq.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
        };
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { rej(rq.error || new Error('เปิดคลังรูปไม่สำเร็จ')); };
        rq.onblocked = function () { rej(new Error('คลังรูปถูกใช้งานอยู่ในแท็บอื่น')); };
      });
      return dbPromise;
    }

    function newId() {
      return 'img' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    /* บันทึกรูป (Blob) แล้วคืนรหัสรูป */
    function put(blob) {
      if (DB && DB.on()) return DB.putPhoto(blob);
      var id = newId();
      return open().then(function (db) {
        return new Promise(function (res, rej) {
          var t = db.transaction(STORE, 'readwrite');
          t.objectStore(STORE).put({ id: id, blob: blob, size: blob.size, type: blob.type, created: Date.now() });
          t.oncomplete = function () { res(id); };
          t.onerror = function () { rej(t.error || new Error('บันทึกรูปไม่สำเร็จ')); };
          t.onabort = function () { rej(t.error || new Error('พื้นที่จัดเก็บไม่พอ')); };
        });
      });
    }

    function getRec(id) {
      return open().then(function (db) {
        return new Promise(function (res, rej) {
          var t = db.transaction(STORE, 'readonly');
          var rq = t.objectStore(STORE).get(id);
          rq.onsuccess = function () { res(rq.result || null); };
          rq.onerror = function () { rej(rq.error); };
        });
      });
    }

    function del(id) {
      if (DB && DB.isPhotoRef && DB.isPhotoRef(id)) return DB.delPhoto(id);
      if (urlCache[id]) { try { URL.revokeObjectURL(urlCache[id]); } catch (e) { } delete urlCache[id]; }
      return open().then(function (db) {
        return new Promise(function (res, rej) {
          var t = db.transaction(STORE, 'readwrite');
          t.objectStore(STORE)['delete'](id);
          t.oncomplete = function () { res(true); };
          t.onerror = function () { rej(t.error); };
        });
      })['catch'](function () { return false; });
    }

    /* รายการรหัสรูปทั้งหมด + ขนาดรวม */
    function all() {
      return open().then(function (db) {
        return new Promise(function (res, rej) {
          var t = db.transaction(STORE, 'readonly');
          var out = [];
          var rq = t.objectStore(STORE).openCursor();
          rq.onsuccess = function () {
            var c = rq.result;
            if (!c) { res(out); return; }
            out.push({ id: c.value.id, size: c.value.size || 0, type: c.value.type, created: c.value.created });
            c['continue']();
          };
          rq.onerror = function () { rej(rq.error); };
        });
      })['catch'](function () { return []; });
    }

    /* URL สำหรับใส่ใน <img src> */
    function url(ref) {
      if (!ref) return Promise.resolve('');
      if (String(ref).indexOf('data:') === 0) return Promise.resolve(String(ref));
      if (DB && DB.isPhotoRef && DB.isPhotoRef(ref)) return DB.getPhoto(ref);
      if (urlCache[ref]) return Promise.resolve(urlCache[ref]);
      return getRec(ref).then(function (rec) {
        if (!rec || !rec.blob) return '';
        var u = URL.createObjectURL(rec.blob);
        urlCache[ref] = u;
        return u;
      })['catch'](function () { return ''; });
    }

    /* แปลงกลับเป็น data URL (ใช้ตอนสำรองข้อมูล) */
    function toDataUrl(ref) {
      if (!ref) return Promise.resolve('');
      if (String(ref).indexOf('data:') === 0) return Promise.resolve(String(ref));
      if (DB && DB.isPhotoRef && DB.isPhotoRef(ref)) {
        return DB.getPhoto(ref).then(function (u) {
          if (!u) return '';
          return fetch(u).then(function (r) { return r.blob(); }).then(function (b) {
            return new Promise(function (res) {
              var fr = new FileReader();
              fr.onload = function () { res(String(fr.result)); };
              fr.onerror = function () { res(''); };
              fr.readAsDataURL(b);
            });
          })['catch'](function () { return ''; });
        });
      }
      return getRec(ref).then(function (rec) {
        if (!rec || !rec.blob) return '';
        return new Promise(function (res) {
          var fr = new FileReader();
          fr.onload = function () { res(String(fr.result)); };
          fr.onerror = function () { res(''); };
          fr.readAsDataURL(rec.blob);
        });
      })['catch'](function () { return ''; });
    }

    /* บันทึกจาก data URL (ใช้ตอนกู้คืนข้อมูล) */
    function putDataUrl(d) {
      return fetch(d).then(function (r) { return r.blob(); }).then(put);
    }

    /* ใส่รูปลงใน element <img> ให้เลย */
    function paint(el, ref) {
      if (!el) return Promise.resolve('');
      return url(ref).then(function (u) {
        if (u) { el.src = u; el.removeAttribute('data-missing'); }
        else { el.removeAttribute('src'); el.setAttribute('data-missing', '1'); el.alt = 'ไม่พบรูป'; }
        return u;
      });
    }
    /* ใส่รูปให้ทุก element ที่มี data-photo ในบล็อกที่กำหนด */
    function paintAll(root) {
      var els = (root || document).querySelectorAll('img[data-photo]');
      return Promise.all(Array.prototype.map.call(els, function (el) {
        var ref = el.getAttribute('data-photo');
        el.removeAttribute('data-photo');
        return paint(el, ref);
      }));
    }

    function releaseAll() {
      for (var k in urlCache) if (urlCache.hasOwnProperty(k)) {
        try { URL.revokeObjectURL(urlCache[k]); } catch (e) { }
      }
      urlCache = {};
    }
    global.addEventListener('pagehide', releaseAll);

    return {
      supported: supported, put: put, get: getRec, del: del, all: all,
      url: url, toDataUrl: toDataUrl, putDataUrl: putDataUrl,
      paint: paint, paintAll: paintAll, release: releaseAll
    };
  })();

  /* ---------- 3.5 รูปภาพ: ย่อขนาด + แปลงเป็น data URL ---------- */
  var MAX_UPLOAD = 20 * 1024 * 1024;   // ไฟล์ต้นทางไม่เกิน 20 MB
  function readImageFile(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      if (!file) return reject(new Error('ไม่พบไฟล์'));
      if (!/^image\//.test(file.type)) return reject(new Error('กรุณาเลือกไฟล์รูปภาพ (jpg, png, webp)'));
      if (file.size > MAX_UPLOAD) return reject(new Error('ไฟล์ใหญ่เกิน 20 MB กรุณาย่อรูปก่อน'));
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('อ่านไฟล์ไม่สำเร็จ')); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('ไฟล์รูปเสียหายหรือเปิดไม่ได้')); };
        img.onload = function () {
          try {
            var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
            var sc = Math.min(1, (maxSide || 1000) / Math.max(w, h));
            var cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(h * sc));
            var c = document.createElement('canvas');
            c.width = cw; c.height = ch;
            var ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cw, ch);
            ctx.drawImage(img, 0, 0, cw, ch);
            resolve(c.toDataURL('image/jpeg', quality || 0.72));
          } catch (e) { reject(new Error('ย่อรูปไม่สำเร็จ: ' + e.message)); }
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  /* ย่อรูปแล้วคืนเป็นไฟล์ (Blob) + URL สำหรับพรีวิว — ประหยัดกว่า data URL 33% */
  function prepareImage(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      if (!file) return reject(new Error('ไม่พบไฟล์'));
      if (!/^image\//.test(file.type)) return reject(new Error('กรุณาเลือกไฟล์รูปภาพ (jpg, png, webp)'));
      if (file.size > MAX_UPLOAD) return reject(new Error('ไฟล์ใหญ่เกิน 20 MB กรุณาย่อรูปก่อน'));
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('อ่านไฟล์ไม่สำเร็จ')); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('ไฟล์รูปเสียหายหรือเปิดไม่ได้')); };
        img.onload = function () {
          try {
            var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
            var sc = Math.min(1, (maxSide || 1400) / Math.max(w, h));
            var cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(h * sc));
            var c = document.createElement('canvas');
            c.width = cw; c.height = ch;
            var ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cw, ch);
            ctx.drawImage(img, 0, 0, cw, ch);
            var done = function (blob) {
              if (!blob) return reject(new Error('ย่อรูปไม่สำเร็จ'));
              resolve({ blob: blob, url: URL.createObjectURL(blob), w: cw, h: ch, size: blob.size });
            };
            if (c.toBlob) c.toBlob(done, 'image/jpeg', quality || 0.75);
            else {
              /* เบราว์เซอร์เก่าที่ไม่มี toBlob */
              var d = c.toDataURL('image/jpeg', quality || 0.75);
              fetch(d).then(function (r) { return r.blob(); }).then(done)['catch'](function () {
                reject(new Error('ย่อรูปไม่สำเร็จ'));
              });
            }
          } catch (e) { reject(new Error('ย่อรูปไม่สำเร็จ: ' + e.message)); }
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  /* ขนาดโดยประมาณของ data URL (ไบต์) */
  function dataUrlSize(d) { return d ? Math.round((String(d).length - 22) * 0.75) : 0; }
  function fmtBytes(b) {
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(0) + ' KB';
    return (b / 1024 / 1024).toFixed(1) + ' MB';
  }
  /* พื้นที่ที่ใช้ไปทั้งหมดใน localStorage ของเว็บนี้ */
  function storageUsed() {
    var total = 0;
    try {
      for (var k in localStorage) if (k.indexOf(NS) === 0 && localStorage.hasOwnProperty(k)) {

      var gap = series.length > 1 ? 2 : 0;
      var barW = Math.max(3, (inner - gap * (series.length - 1)) / series.length);
      barW = Math.min(barW, 84);                       /* กันแท่งอ้วนเกินไปเมื่อมีข้อมูลน้อย */
      var groupW = barW * series.length + gap * (series.length - 1);

      var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img', 'aria-label': o.title || 'กราฟแท่ง' });

      var zeroY = mT + plotH * (yMax / span);   /* ตำแหน่งเส้นศูนย์ */

      /* แกน Y + เส้นกริด */
      for (var t = 0; t <= TICKS; t++) {
        var val = sc.rnd(yMin + sc.step * t);
        var y = mT + plotH - (plotH * t / TICKS);
        var isZero = Math.abs(val) < span / 10000;
        svg.appendChild(el('line', {
          x1: mL, y1: y, x2: W - mR, y2: y,
          stroke: (t === 0 || isZero) ? AXIS : GRID, 'stroke-width': (t === 0 || isZero) ? 1.4 : 1
        }));
        svg.appendChild(el('text', { x: mL - 9, y: y + 3.8, 'text-anchor': 'end', fill: MUTED, 'font-size': 11, 'font-family': 'inherit' }, fmt(val)));
      }
      if (yMin < 0) {
        svg.appendChild(el('line', { x1: mL, y1: zeroY, x2: W - mR, y2: zeroY, stroke: AXIS, 'stroke-width': 1.4 }));
      }

      /* แท่ง */
      cats.forEach(function (cat, ci) {
        var bx = mL + band * ci + (band - groupW) / 2;   /* จัดกลุ่มแท่งให้อยู่กลางช่อง */
        series.forEach(function (s, si) {
          var v = Number(s.values[ci]) || 0;
          var h = Math.abs(v) / span * plotH;
          var x = bx + si * (barW + gap);
          var neg = v < 0;
          var y = neg ? zeroY : zeroY - h;
          if (h > 0.4) {
            var p = el('path', {
              d: neg ? bottomRoundPath(x, y, barW, h, 4) : topRoundPath(x, y, barW, h, 4),
              fill: s.color, class: 'bar-rect', 'data-ci': ci
            });
            p.appendChild(el('title', {}, cat + ' — ' + s.name + ': ' + fmt(v)));
            svg.appendChild(p);
          }
          /* ป้ายค่าบนแท่ง (เมื่อพื้นที่พอ) */
          if (barW >= 26 && v !== 0) {
            svg.appendChild(el('text', {
              x: x + barW / 2, y: neg ? y + h + 13 : y - 6, 'text-anchor': 'middle',
              fill: neg ? '#8c1f1f' : INK,
              'font-size': Math.min(11, barW * 0.42), 'font-weight': 700, 'font-family': 'inherit'
            }, fmt(v)));
          }
        });

        /* ป้ายแกน X */
        var cx = mL + band * ci + band / 2;
        var label = clip(cat, 20);
        var tEl;
        if (rotate) {
          tEl = el('text', {
            x: cx, y: mT + plotH + 13, fill: MUTED, 'font-size': labelSize,
            'text-anchor': 'end', 'font-family': 'inherit',
            transform: 'rotate(-38 ' + cx + ' ' + (mT + plotH + 13) + ')'
          }, label);
        } else {
          tEl = el('text', {
            x: cx, y: mT + plotH + 17, fill: MUTED, 'font-size': labelSize,
            'text-anchor': 'middle', 'font-family': 'inherit'
          }, label);
        }
        tEl.appendChild(el('title', {}, cat));
        svg.appendChild(tEl);
      });

      /* พื้นที่ hover */
      cats.forEach(function (cat, ci) {
        var hit = el('rect', {
          x: mL + band * ci, y: mT, width: band, height: plotH,
          fill: 'transparent', style: 'cursor:pointer'
        });
        hit.addEventListener('mouseenter', function () {
          holder.classList.add('dim');
          holder.querySelectorAll('.bar-rect').forEach(function (b) {
            b.classList.toggle('hot', b.getAttribute('data-ci') === String(ci));
          });
          tip.innerHTML = '<span class="t-cat">' + esc(cat) + '</span>' + series.map(function (s) {
            return '<span class="t-row"><span class="sw" style="background:' + s.color + '"></span>' +
              esc(s.name) + '<b>' + esc(fmt(Number(s.values[ci]) || 0)) + '</b></span>';
          }).join('');
          tip.classList.add('show');
          var scale = (holder.clientWidth || W) / W;
          tip.style.left = ((mL + band * ci + band / 2) * scale) + 'px';
          tip.style.top = Math.max(58, (mT + plotH * 0.35) * scale) + 'px';
        });
        hit.addEventListener('mouseleave', function () {
          holder.classList.remove('dim');
          tip.classList.remove('show');
          holder.querySelectorAll('.bar-rect').forEach(function (b) { b.classList.remove('hot'); });
        });
        svg.appendChild(hit);
      });

      holder.querySelectorAll('svg').forEach(function (n) { n.remove(); });
      holder.appendChild(svg);
    }

    draw();
    var raf;
    var ro = global.ResizeObserver ? new ResizeObserver(function () {
      cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);
    }) : null;
    if (ro) ro.observe(holder); else global.addEventListener('resize', function () { clearTimeout(raf); raf = setTimeout(draw, 150); });
  }

  /* ---------- 7. ตัวช่วยตาราง ---------- */
  function countBy(arr, fn) {
    var m = {};
    arr.forEach(function (x) { var k = fn(x); if (k == null || k === '') return; m[k] = (m[k] || 0) + 1; });
    return m;
  }
  function sortedEntries(obj, desc) {
    return Object.keys(obj).map(function (k) { return [k, obj[k]]; })
      .sort(function (a, b) { return desc === false ? a[1] - b[1] : b[1] - a[1]; });
  }
  function exportCSV(filename, headers, rows) {
    var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    var csv = '﻿' + [headers.map(q).join(',')].concat(rows.map(function (r) { return r.map(q).join(','); })).join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------- 8. คะแนนสภาพจิตใจ ---------- */
  var LEVELS = [
    { n: 1, min: 10, max: 17, name: 'ดีมาก', cls: 'level-1', short: 'ระดับ 1 · ดีมาก' },
    { n: 2, min: 18, max: 25, name: 'ดี', cls: 'level-2', short: 'ระดับ 2 · ดี' },

    { n: 4, min: 34, max: 41, name: 'ควรเฝ้าระวัง', cls: 'level-4', short: 'ระดับ 4 · ควรเฝ้าระวัง' },
    { n: 5, min: 42, max: 50, name: 'ควรพบผู้เชี่ยวชาญ', cls: 'level-5', short: 'ระดับ 5 · ควรพบผู้เชี่ยวชาญ' }
  ];
  function levelOf(score) {
    for (var i = 0; i < LEVELS.length; i++) if (score <= LEVELS[i].max) return LEVELS[i];
    return LEVELS[LEVELS.length - 1];
  }

  /* ---------- 9. เริ่มทำงาน ---------- */
  function ready(fn) {
    if (document.readyState !== 'loading') fn();
    else document.addEventListener('DOMContentLoaded', fn);
  }
  function domReady() {
    return new Promise(function (res) { ready(res); });
  }

  /* บอกผู้ใช้ว่ากำลังเชื่อมต่อฐานข้อมูลอยู่ */
  function showLoading(on) {
    var el = document.getElementById('spLoading');
    if (on) {
      if (el) return;
      el = document.createElement('div');
      el.id = 'spLoading';
      el.className = 'sp-loading';
      el.innerHTML = '<div class="sp-spin"></div><span>กำลังเชื่อมต่อฐานข้อมูล...</span>';
      document.body.appendChild(el);
    } else if (el) { el.remove(); }
  }

  /* SP.boot(fn) — รอให้ทั้ง DOM และข้อมูลพร้อมก่อนค่อยเรียก fn
     โหมดเครื่องเดียวจะเรียกทันที โหมดออนไลน์จะรอโหลดข้อมูลชุดแรกให้เสร็จก่อน */
  var bootPromise = null;
  function bootAll() {
    if (bootPromise) return bootPromise;
    bootPromise = domReady().then(function () {
      if (!(DB && DB.enabled)) return null;
      showLoading(true);
      return DB.start()['catch'](function () { return null; });
    }).then(function () {
      showLoading(false);
      Student.touch();
      buildTopbar();
      buildFooter();
      if (!storageOK && !(DB && DB.on())) {
        var note = document.querySelector('.no-storage-note');
        if (note) note.classList.add('show');
      }
      var y = document.getElementById('yearNow');
      if (y) y.textContent = String(new Date().getFullYear() + 543);
      if (DB && DB.enabled) {
        DB.onSync(function () { buildTopbar(); });
      }
    });
    return bootPromise;
  }
  function boot(fn) {
    return bootAll().then(function () {
      try { fn(); } catch (e) { console.error(e); }
    });
  }
  /* วาดหน้าใหม่เมื่อมีคนอื่นแก้ข้อมูล (โหมดออนไลน์เท่านั้น)
     ถ้าเปลี่ยนหน้าไปแล้ว ตัวรับของหน้าเก่าจะไม่ทำงาน */
  function onSync(fn) {
    if (!(DB && DB.enabled)) return;
    var mine = epoch;
    DB.onSync(function () {
      if (mine !== epoch) return;
      try { fn(); } catch (e) { console.error(e); }
    });
  }

  bootAll();

  /* ---------- 10. ส่งออก ---------- */
  global.SP = {
    KEY: KEY, read: read, write: write, list: list, push: push, storageOK: storageOK,
    DB: DB, online: online, boot: boot, onSync: onSync, ready: ready,
    flush: function () { return (DB && DB.on()) ? DB.flush() : Promise.resolve(); },
    setRoute: setRoute, params: params, currentPage: currentPage, pageUrl: pageUrl,
    applyImages: applyImages, rebuildChrome: rebuildChrome,
    go: function (url) { return (DB && DB.on() ? DB.flush() : Promise.resolve())
      .then(function () { location.href = url; }); },
    stamp: stamp, thaiDate: thaiDate, thaiTime: thaiTime, fmtNum: fmtNum, fmtBaht: fmtBaht, esc: esc,

    storageInfo: storageInfo, requestPersist: requestPersist, usedPhotoRefs: usedPhotoRefs,
    sendOtpEmail: sendOtpEmail, EMAILJS: EMAILJS, validEmail: validEmail, normEmail: normEmail,

    barChart: barChart, PALETTE: PALETTE, SOLO: SOLO,
    countBy: countBy, sortedEntries: sortedEntries, exportCSV: exportCSV,

      'กิจกรรมวันแม่แห่งชาติ', 'กิจกรรมวันพ่อแห่งชาติ', 'กิจกรรมวันลอยกระทง',
      'กิจกรรมวันคริสต์มาส', 'กิจกรรมวันปีใหม่', 'กิจกรรมวันเด็กแห่งชาติ',
      'ค่ายลูกเสือ-เนตรนารี', 'ทัศนศึกษานอกสถานที่', 'ตลาดนัดนักเรียน',
      'ประกวดดนตรีและร้องเพลง', 'แข่งขันทักษะวิชาการ', 'กิจกรรมจิตอาสาพัฒนาโรงเรียน',
      'กีฬาต้านยาเสพติด', 'งานปัจฉิมนิเทศ'
    ],
    PROBLEMS: [

      'อื่น ๆ'
    ],

    ],
    ROOMS: (function () {
      var out = [];
      for (var g = 1; g <= GRADES; g++) for (var r = 1; r <= ROOMS_PER_GRADE; r++) out.push('ม.' + g + '/' + r);
      return out;
    })(),

<script>
/* ============================================================

(function () {

PAGES['intex7'] = {
  nav: 'student', active: 'intex7', footer: false,

  /* ---- แท็บ ---- */

  tabR.addEventListener('click', function () { showTab('reg'); });

  /* แจ้งว่ามีการตรวจสอบกับคลังรายชื่อหรือไม่ */

  if (SP.Roster.all().length && SP.Roster.strict()) {
    note.innerHTML = '<strong>ชื่อ-นามสกุล ชั้น และเลขที่ ต้องตรงกับคลังรายชื่อของโรงเรียน</strong> ' +

  } else if (ONLINE) {
    note.innerHTML = 'ระบบจะตรวจข้อมูลกับคลังรายชื่อของโรงเรียนอีกครั้งที่ฝั่งเซิร์ฟเวอร์';
  }

  /* ================= เข้าสู่ระบบ ================= */
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    errBox.classList.remove('show');

          setTimeout(function () { location.href = '#intex7.1?email=' + encodeURIComponent(email); }, 1500);
        } else fail(m || 'เข้าสู่ระบบไม่สำเร็จ');
      });
      return;
    }

    /* ---- โหมดเครื่องเดียว: รหัสนักเรียน + อีเมล → OTP ---- */
    var sid = document.getElementById('l-sid').value.trim();
    var okAll = true;
    okAll = mark('l-sid', !sid) && okAll;
    okAll = mark('l-email', !SP.validEmail(email)) && okAll;
    if (!okAll) return;

    var rec = SP.Student.bySid(sid);
    if (!rec) { fail('ไม่พบรหัสนักเรียนนี้ในระบบ กรุณาลงทะเบียนก่อน'); return; }
    if (SP.normEmail(rec.email) !== SP.normEmail(email)) {
      fail('อีเมลไม่ตรงกับที่ลงทะเบียนไว้ด้วยรหัสนักเรียนนี้'); return;
    }
    var chk = SP.Roster.check({ sid: rec.sid, name: rec.name, room: rec.room, no: rec.no });
    if (!chk.ok) { fail(SP.Roster.message(chk) + ' — กรุณาติดต่อคณะกรรมการสภานักเรียน'); return; }
    SP.Otp.issue('login', { sid: rec.sid, email: rec.email, name: rec.name });
    location.href = '#intex7.1?next=' + encodeURIComponent(next);
  });

  /* ลืมรหัสผ่าน */
  var fb = document.getElementById('forgotBtn');

    var email = document.getElementById('l-email').value.trim();
    if (!SP.validEmail(email)) { mark('l-email', true); fail('กรอกอีเมลก่อน แล้วกด “ลืมรหัสผ่าน” อีกครั้ง'); return; }
    SP.DB.resetPassword(email).then(function () {
      ok('ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่ ' + email + ' แล้ว กรุณาตรวจกล่องจดหมาย');
    })['catch'](function (err) { fail(err.message || 'ส่งอีเมลไม่สำเร็จ'); });
  });

  /* ================= ลงทะเบียน ================= */
  document.getElementById('regForm').addEventListener('submit', function (e) {
    e.preventDefault();
    errBox.classList.remove('show');
    var name = document.getElementById('r-name').value.trim();
    var sid = document.getElementById('r-sid').value.trim();
    var room = roomSel.value;
    var no = document.getElementById('r-no').value.trim();
    var email = document.getElementById('r-email').value.trim();
    var btn = document.getElementById('regBtn');

    var good = true;
    good = mark('r-name', !name) && good;
    good = mark('r-sid', !sid) && good;
    good = mark('r-room', !room) && good;
    good = mark('r-no', !no || +no < 1 || +no > 60) && good;
    good = mark('r-email', !SP.validEmail(email)) && good;

    var pass = '';
    if (ONLINE) {
      pass = document.getElementById('r-pass').value;
      var pass2 = document.getElementById('r-pass2').value;
      good = mark('r-pass', pass.length < 6) && good;
      good = mark('r-pass2', pass !== pass2) && good;
    }
    if (!good) { fail('กรุณากรอกข้อมูลให้ครบและถูกต้อง'); return; }

    var payload = { sid: sid, name: name, room: room, no: no, email: email };

    if (ONLINE) {
      btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
      /* ตรวจกับคลังรายชื่อก่อน เพื่อบอกสาเหตุที่ชัดเจนกว่าข้อความจากฐานข้อมูล */
      SP.DB.rosterOnce(sid).then(function (r) {
        var strict = SP.Roster.strict();
        if (strict && SP.Roster.all().length && !r) {
          throw new Error('ROSTER:ไม่พบรหัสนักเรียนนี้ในคลังรายชื่อของโรงเรียน');
        }
        if (r) {
          if (String(r.name).trim() !== name) throw new Error('ROSTER:ชื่อ - นามสกุล ไม่ตรงกับคลังรายชื่อ (ในคลังคือ “' + r.name + '”)');
          if (String(r.room).trim() !== room) throw new Error('ROSTER:ชั้นเรียนไม่ตรงกับคลังรายชื่อ (ในคลังคือ “' + r.room + '”)');
          if (String(r.no).trim() !== no) throw new Error('ROSTER:เลขที่ไม่ตรงกับคลังรายชื่อ (ในคลังคือ “' + r.no + '”)');
        }
        btn.textContent = 'กำลังสร้างบัญชี...';
        return SP.DB.signUp(email, pass);
      }).then(function (data) {
        /* ถ้าเปิดยืนยันอีเมล จะยังไม่มี session ให้ไปหน้ารอยืนยัน */
        if (!data.session) {
          try { localStorage.setItem('sapara2569.pendingReg', JSON.stringify(payload)); } catch (er) { }
          location.href = '#intex7.1?email=' + encodeURIComponent(email);
          return null;
        }
        return SP.DB.refreshRole().then(function () { return SP.DB.createMyStudent(payload); });
      }).then(function (created) {
        if (created === null) return;
        return SP.DB.refreshRole().then(function () {
          return SP.DB.refetchAll();
        }).then(function () { location.replace(next); });
      })['catch'](function (err) {
        btn.disabled = false; btn.textContent = 'ลงทะเบียน';
        var m = String(err.message || '');
        if (m.indexOf('ROSTER:') === 0) { mark('r-sid', true); fail(m.slice(7)); return; }
        if (/already registered|User already/i.test(m)) fail('อีเมลนี้เคยสมัครไว้แล้ว กรุณาไปที่แท็บ “เข้าสู่ระบบ”');
        else if (/duplicate key|students_sid_key/i.test(m)) { mark('r-sid', true); fail('รหัสนักเรียนนี้ลงทะเบียนไว้แล้ว'); }
        else if (/row-level security|policy/i.test(m)) fail('ข้อมูลไม่ตรงกับคลังรายชื่อของโรงเรียน กรุณาตรวจสอบอีกครั้ง หรือแจ้งคณะกรรมการสภานักเรียน');
        else if (/Password should be/i.test(m)) { mark('r-pass', true); fail('รหัสผ่านสั้นเกินไป'); }
        else fail(m || 'ลงทะเบียนไม่สำเร็จ');
      });
      return;
    }

    /* ---- โหมดเครื่องเดียว ---- */
    if (SP.Student.bySid(sid)) {
      document.getElementById('sidErr').textContent = 'รหัสนักเรียนนี้ลงทะเบียนไว้แล้ว';
      mark('r-sid', true); fail('รหัสนักเรียนนี้ลงทะเบียนไว้แล้ว กรุณาไปที่แท็บ “เข้าสู่ระบบ”'); return;
    }
    var dup = SP.Student.byEmail(email);
    if (dup) {
      document.getElementById('emailErr').textContent = 'อีเมลนี้ถูกใช้กับรหัสนักเรียน ' + dup.sid + ' แล้ว';
      mark('r-email', true); fail('อีเมลนี้ถูกใช้ลงทะเบียนไปแล้ว'); return;
    }
    var chk2 = SP.Roster.check(payload);
    if (!chk2.ok) {
      var fieldMap = { sid: 'r-sid', name: 'r-name', room: 'r-room', no: 'r-no' };
      mark(fieldMap[chk2.field] || 'r-sid', true);
      var msg = SP.Roster.message(chk2);
      if (chk2.expect) msg += ' (ในคลังระบุว่า “' + chk2.expect + '”)';
      fail(msg); return;
    }
    SP.Otp.issue('register', payload);
    location.href = '#intex7.1?next=' + encodeURIComponent(next);
  });
  }
};

PAGES['intex7.1'] = {
  nav: 'student', active: 'intex7', footer: false,
  title: "ยืนยันตัวตน | สภานักเรียนโรงเรียนร้องกวางอนุสรณ์",
  init: function () {
  var qs = SP.params();
  var next = qs.get('next') || '#intex1';
  var ONLINE = SP.DB && SP.DB.live();
  var okBox = document.getElementById('okBox'), errBox = document.getElementById('errBox');

  function ok(m) { okBox.textContent = '✅ ' + m; okBox.classList.add('show'); errBox.classList.remove('show'); }
  function fail(m) { errBox.textContent = '❌ ' + m; errBox.classList.add('show'); okBox.classList.remove('show'); }
  function maskEmail(e) {
    var p = String(e).split('@');
    if (p.length < 2) return e;
    var u = p[0], head = u.slice(0, Math.min(3, Math.max(1, u.length - 1)));
    return head + '•••@' + p[1];
  }

  /* ================= โหมดออนไลน์ ================= */
  if (ONLINE) {
    var email = qs.get('email') || (SP.DB.user() ? SP.DB.user().email : '');
    document.getElementById('panelMail').hidden = false;
    document.getElementById('headTitle').textContent = 'ยืนยันอีเมลของคุณ';
    document.getElementById('sentTo').innerHTML = email
      ? 'ส่งไปที่ <strong>' + SP.esc(maskEmail(email)) + '</strong>'
      : 'กรุณายืนยันอีเมลที่ใช้สมัคร';

    /* ถ้ายืนยันแล้วและมี session ให้สร้างข้อมูลนักเรียนที่ค้างไว้ */
    function finish() {
      var pending = null;
      try { pending = JSON.parse(localStorage.getItem('sapara2569.pendingReg') || 'null'); } catch (e) { }
      return SP.DB.refreshRole().then(function (st) {
        if (st.sid) return true;
        if (!pending) return false;
        return SP.DB.createMyStudent(pending).then(function () {
          try { localStorage.removeItem('sapara2569.pendingReg'); } catch (e) { }
          return SP.DB.refreshRole();
        }).then(function () { return true; });
      });
    }

    if (SP.DB.user()) {
      finish().then(function (done) {
        if (done) {
          ok('ยืนยันเรียบร้อยแล้ว กำลังเข้าสู่ระบบ...');
          setTimeout(function () { location.replace(next); }, 700);
        }
      })['catch'](function (e) { fail(e.message || 'สร้างข้อมูลนักเรียนไม่สำเร็จ'); });
    }

    document.getElementById('checkBtn').addEventListener('click', function () {
      var b = this; b.disabled = true; b.textContent = 'กำลังตรวจสอบ...';
      SP.DB.client().auth.getSession().then(function (r) {
        var s = r && r.data ? r.data.session : null;
        if (!s) {
          fail('ยังไม่พบการยืนยัน — กรุณากดลิงก์ในอีเมลก่อน แล้วกลับมากดปุ่มนี้อีกครั้ง');
          b.disabled = false; b.textContent = 'ฉันยืนยันแล้ว';
          return;
        }
        return finish().then(function () {
          ok('ยืนยันเรียบร้อยแล้ว กำลังเข้าสู่ระบบ...');
          setTimeout(function () { location.replace(next); }, 700);
        });
      })['catch'](function (e) {
        fail(e.message || 'ตรวจสอบไม่สำเร็จ');
        b.disabled = false; b.textContent = 'ฉันยืนยันแล้ว';
      });
    });

    document.getElementById('resendBtn2').addEventListener('click', function () {
      if (!email) { fail('ไม่ทราบอีเมล กรุณากลับไปหน้าเข้าสู่ระบบ'); return; }
      var b = this; b.disabled = true; b.textContent = 'กำลังส่ง...';
      SP.DB.resendConfirm(email).then(function () {
        ok('ส่งอีเมลยืนยันอีกครั้งแล้ว');
      })['catch'](function (e) {
        fail(/rate/i.test(e.message || '') ? 'ส่งถี่เกินไป กรุณารอสักครู่แล้วลองใหม่' : (e.message || 'ส่งไม่สำเร็จ'));
      }).then(function () { b.disabled = false; b.textContent = 'ส่งอีเมลอีกครั้ง'; });
    });
    return;
  }

  /* ================= โหมดเครื่องเดียว (OTP) ================= */
  document.getElementById('panelOtp').hidden = false;
  var rec = SP.Otp.get();
  if (!rec) { location.replace('#intex7'); return; }

  var demoBox = document.getElementById('demoBox'), demoCode = document.getElementById('demoCode'),
      inputs = Array.prototype.slice.call(document.querySelectorAll('.otp-inputs input')),
      resendBtn = document.getElementById('resendBtn'), verifyBtn = document.getElementById('verifyBtn');

  document.getElementById('sentTo').innerHTML =
    (rec.purpose === 'register' ? 'ลงทะเบียนใหม่ · ' : '') +
    'ส่งรหัสไปที่ <strong>' + SP.esc(maskEmail(rec.email)) + '</strong>';

  function deliver(r) {
    demoBox.hidden = true;
    SP.sendOtpEmail(r).then(function (res) {
      if (res.sent) ok('ส่งรหัส OTP ไปที่อีเมลของคุณแล้ว');
      else {
        demoCode.textContent = r.code; demoBox.hidden = false;
        if (res.reason && res.reason !== 'demo' && res.reason !== 'no-lib') {
          fail('ส่งอีเมลไม่สำเร็จ (' + res.reason + ') ระบบจึงแสดงรหัสให้ที่หน้านี้แทน');
        }
      }
    });
  }
  deliver(rec);

  inputs.forEach(function (inp, i) {
    inp.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '').slice(0, 1);
      this.classList.toggle('filled', !!this.value);
      if (this.value && i < inputs.length - 1) inputs[i + 1].focus();
      if (inputs.every(function (x) { return x.value; })) setTimeout(submit, 120);
    });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !this.value && i > 0) { inputs[i - 1].focus(); inputs[i - 1].value = ''; inputs[i - 1].classList.remove('filled'); }
      if (e.key === 'ArrowLeft' && i > 0) inputs[i - 1].focus();
      if (e.key === 'ArrowRight' && i < inputs.length - 1) inputs[i + 1].focus();
    });
    inp.addEventListener('paste', function (e) {
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
      for (var k = 0; k < t.length && (i + k) < inputs.length; k++) {
        inputs[i + k].value = t[k]; inputs[i + k].classList.add('filled');
      }
      inputs[Math.min(i + t.length, inputs.length - 1)].focus();
      if (inputs.every(function (x) { return x.value; })) setTimeout(submit, 120);
    });
  });
  inputs[0].focus();
  function clearInputs() { inputs.forEach(function (x) { x.value = ''; x.classList.remove('filled'); }); inputs[0].focus(); }

  var cdEl = document.getElementById('countdown');
  function tick() {
    var left = SP.Otp.ttlLeft();
    if (left <= 0) { cdEl.textContent = 'รหัสหมดอายุแล้ว'; verifyBtn.disabled = true; return; }
    verifyBtn.disabled = false;
    var m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
    cdEl.textContent = 'รหัสหมดอายุใน ' + m + ':' + (s < 10 ? '0' : '') + s + ' นาที';
  }
  function tickResend() {
    var left = SP.Otp.canResend();
    resendBtn.disabled = left > 0;
    resendBtn.textContent = left > 0 ? 'ขอรหัสใหม่ได้ใน ' + Math.ceil(left / 1000) + ' วิ' : 'ขอรหัสใหม่';
  }
  tick(); tickResend();
  setInterval(function () { tick(); tickResend(); }, 1000);

  resendBtn.addEventListener('click', function () {
    var r = SP.Otp.resend();
    if (!r) { location.replace('#intex7'); return; }
    clearInputs(); ok('ส่งรหัสใหม่เรียบร้อยแล้ว'); deliver(r); tick(); tickResend();
  });

  function submit() {
    var code = inputs.map(function (x) { return x.value; }).join('');
    if (code.length < 6) { fail('กรุณากรอกรหัสให้ครบ 6 หลัก'); return; }
    var v = SP.Otp.verify(code);
    if (!v.ok) {
      clearInputs();
      if (v.reason === 'expired') fail('รหัสหมดอายุแล้ว กรุณากด “ขอรหัสใหม่”');
      else if (v.reason === 'locked') { fail('ใส่รหัสผิดครบ ' + SP.OTP_MAX_TRY + ' ครั้ง กรุณากด “ขอรหัสใหม่”'); verifyBtn.disabled = true; }
      else if (v.reason === 'none') location.replace('#intex7');
      else fail('รหัสไม่ถูกต้อง เหลือโอกาสอีก ' + v.left + ' ครั้ง');
      return;
    }
    var d = v.rec.payload;
    if (v.rec.purpose === 'register') {
      var st = SP.stamp();
      SP.Student.save({
        sid: String(d.sid).trim(), name: d.name, room: d.room, no: d.no,
        email: SP.normEmail(d.email), verified: true,
        createdAt: st.iso, createdDate: st.date, createdTime: st.time, updatedAt: st.iso
      });
      if (!SP.Roster.bySid(d.sid)) SP.Roster.add({ sid: d.sid, name: d.name, room: d.room, no: d.no });
    } else if (v.rec.purpose === 'email') {
      var me = SP.Student.bySid(d.sid);
      if (me) { me.email = SP.normEmail(d.email); me.updatedAt = new Date().toISOString(); SP.Student.save(me); }
    }
    SP.Otp.clear();
    SP.Student.login(d.sid);
    ok('ยืนยันตัวตนสำเร็จ กำลังเข้าสู่ระบบ...');
    verifyBtn.disabled = true;
    setTimeout(function () { location.replace(next); }, 700);
  }
  document.getElementById('otpForm').addEventListener('submit', function (e) { e.preventDefault(); submit(); });
  }
};

    var el = document.getElementById('star' + v);
    if (el) { el.checked = true; starText.textContent = v + ' ดาว — ' + LABELS[v]; }
  }
  starsHost.addEventListener('change', function (e) {
    starErr.style.display = 'none';
    setStars(+e.target.value);
  });

  function paintSummary() {
    var st = SP.Rating.stats();
    var host = document.getElementById('rateSummary');
    if (!st.n) {
      host.innerHTML = '<div class="empty-state" style="padding:18px"><span class="big">⭐</span>ยังไม่มีใครให้คะแนน — เป็นคนแรกได้เลย</div>';
      return;
    }
    var full = Math.round(st.avg);
    var starStr = '';
    for (var i = 1; i <= 5; i++) starStr += '<span class="' + (i <= full ? '' : 'off') + '">★</span>';
    host.innerHTML =
      '<div><div class="rate-big">' + st.avg.toFixed(2) + '</div>' +
        '<div class="stars-static">' + starStr + '</div>' +
        '<div class="text-muted" style="font-size:.82rem;margin-top:4px">จาก ' + st.n + ' คน</div></div>' +
      '<div class="rate-bars">' + [5, 4, 3, 2, 1].map(function (v) {
        var c = st.counts[v - 1], pct = st.n ? c / st.n * 100 : 0;
        return '<div class="rb"><span class="lab">' + v + '★</span>' +
          '<span class="track"><span style="width:' + pct.toFixed(1) + '%"></span></span>' +
          '<span class="cnt">' + c + '</span></div>';
      }).join('') + '</div>';
  }

  function loadMine() {
    var r = SP.Rating.mine(me.sid);
    if (r) {
      setStars(r.stars);
      rComment.value = r.comment || '';
      rateBtn.textContent = 'อัปเดตคะแนน';
      rateClear.style.display = '';
      rateOk.textContent = 'คุณให้คะแนนไว้แล้วเมื่อ ' + r.date + ' — แก้ไขได้ตลอด';
      rateOk.classList.add('show');
    } else {
      rateBtn.textContent = 'ส่งคะแนน';
      rateClear.style.display = 'none';
      rateOk.classList.remove('show');
    }
  }

  document.getElementById('rateForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var sel = document.querySelector('input[name=stars]:checked');
    if (!sel) { starErr.style.display = 'block'; SP.toast('กรุณาเลือกจำนวนดาว'); return; }
    var st = SP.stamp();
    SP.Rating.put({
      id: 'r' + Date.now(), sid: me.sid, name: me.name, room: me.room,
      stars: +sel.value, comment: rComment.value.trim(),
      iso: st.iso, date: st.date, time: st.time
    });
    SP.toast('ขอบคุณสำหรับคะแนน');
    loadMine(); paintSummary();
  });

    loadMine(); paintSummary();
  });

  loadMine(); paintSummary();
  }
};

  init: function () {
  if (!SP.Student.guard()) return;
  var me = SP.Student.current();

  /* กรอกข้อมูลผู้ตอบอัตโนมัติจากบัญชีที่เข้าสู่ระบบ */
  document.getElementById('name').value = me.name;
  document.getElementById('sid').value = me.sid;
  document.getElementById('room').value = me.room;
  document.getElementById('no').value = me.no;

  /* กิจกรรม (แถบเลื่อนลง) */
  var actSel = document.getElementById('activity');
  SP.ACTIVITIES.forEach(function (a) {
    var o = document.createElement('option'); o.value = o.textContent = a; actSel.appendChild(o);
  });
  /* ความชอบ 5 ระดับ */
  document.getElementById('likeScale').innerHTML = SP.LIKE_SCALE.map(function (s) {
    return '<input type="radio" name="like" id="like' + s.v + '" value="' + s.v + '">' +
           '<label for="like' + s.v + '"><span class="num">' + s.v + '</span>' + SP.esc(s.t) + '</label>';
  }).join('');

  function bad(id, on) {
    var f = document.getElementById(id).closest('.field');
    if (f) f.classList.toggle('invalid', on);
    return !on;
  }

  /* เคยโหวตแล้วหรือยัง — โหวตใหม่จะแทนที่ของเดิม (1 คน 1 เสียง) */
  function myVote() {
    var a = SP.list(SP.KEY.VOTE);
    for (var i = a.length - 1; i >= 0; i--) if (String(a[i].sid) === String(me.sid)) return a[i];
    return null;
  }
  var prev = myVote();
  if (prev) {
    var box = document.getElementById('dupBox');
    box.innerHTML = 'คุณเคยโหวต <strong>' + SP.esc(prev.activity) + '</strong> ไว้เมื่อ ' +
      SP.esc(prev.date) + ' ' + SP.esc(prev.time) + ' — ถ้าส่งอีกครั้ง ระบบจะ<strong>แทนที่</strong>ผลโหวตเดิม (1 คน 1 เสียง)';
    box.classList.add('show');
    actSel.value = prev.activity;
    var pl = document.getElementById('like' + prev.like);
    if (pl) pl.checked = true;
    if (prev.suggest) document.getElementById('suggest').value = prev.suggest;
  }

  document.getElementById('voteForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var act = actSel.value;
    var like = document.querySelector('input[name=like]:checked');

    var ok = true;
    ok = bad('activity', !act) && ok;
    document.getElementById('likeErr').style.display = like ? 'none' : 'block';
    if (!like) ok = false;
    if (!ok) {
      SP.toast('กรุณาเลือกกิจกรรมและระดับความชอบ');
      var first = document.querySelector('.field.invalid select');
      if (first) first.focus();
      return;
    }

    /* ส่งข้อมูลพร้อมวันเดือนปีและเวลาไปยังคลังข้อมูล (intex6.4) */
    var st = SP.stamp();
    var all = SP.list(SP.KEY.VOTE).filter(function (v) { return String(v.sid) !== String(me.sid); });
    all.push({
      id: 'v' + Date.now() + Math.floor(Math.random() * 999),
      iso: st.iso, date: st.date, time: st.time,
      sid: me.sid, name: me.name, room: me.room, no: me.no,
      activity: act, like: +like.value,
      suggest: document.getElementById('suggest').value.trim()
    });
    SP.write(SP.KEY.VOTE, all);
    SP.go('#intex2.1?from=vote');
  });
  }
};

      }).join('') +
      '</div><span class="err-msg q-err">กรุณาเลือกคำตอบข้อนี้</span></div>';
  }).join('');

  qHost.addEventListener('change', function (ev) {

    var it = ev.target.closest('.q-item');
    if (it) { it.classList.remove('invalid'); var em = it.querySelector('.q-err'); if (em) em.style.display = 'none'; }
  });

  function bad(id, on) {
    var f = document.getElementById(id).closest('.field');
    if (f) f.classList.toggle('invalid', on);
    return !on;
  }

  document.getElementById('mentalForm').addEventListener('submit', function (e) {

      var item = qHost.querySelector('.q-item[data-q="' + i + '"]');
      if (!sel) {
        ok = false; item.classList.add('invalid');
        item.querySelector('.q-err').style.display = 'block';

        item.classList.remove('invalid');

    sevHint.textContent = v ? '➜ ' + SP.severityOf(v).hint : '';
  });

  probSel.addEventListener('change', function () {
    document.getElementById('otherProblemWrap').style.display = probSel.value === 'อื่น ๆ' ? 'flex' : 'none';
    probSel.closest('.field').classList.remove('invalid');
  });
  placeSel.addEventListener('change', function () {
    document.getElementById('otherPlaceWrap').style.display = placeSel.value === 'อื่น ๆ' ? 'flex' : 'none';
    placeSel.closest('.field').classList.remove('invalid');
  });

  /* ---- รูปภาพ ---- */
  var MAX_PHOTOS = 6;
  var photos = [];   /* [{blob, url, size}] */
  var thumbs = document.getElementById('thumbs'),
      info = document.getElementById('photoInfo'),
      warn = document.getElementById('photoWarn'),
      dz = document.getElementById('dropzone'),
      fileInput = document.getElementById('fileInput');

  function paintPhotos() {
    thumbs.innerHTML = photos.map(function (p, i) {
      return '<div class="thumb"><img src="' + p.url + '" alt="รูปที่ ' + (i + 1) + '" data-i="' + i + '">' +
        '<button type="button" class="rm" data-rm="' + i + '" title="ลบรูปนี้">✕</button>' +
        '<span class="sz">' + SP.fmtBytes(p.size) + '</span></div>';
    }).join('');
    var total = photos.reduce(function (a, p) { return a + p.size; }, 0);
    info.textContent = photos.length
      ? 'แนบแล้ว ' + photos.length + '/' + MAX_PHOTOS + ' รูป · รวม ' + SP.fmtBytes(total)
      : 'ยังไม่ได้แนบรูป';
  }
  function showWarn(msg) {
    warn.textContent = msg; warn.style.display = msg ? 'block' : 'none';
    if (msg) setTimeout(function () { warn.style.display = 'none'; }, 6000);
  }

  function addFiles(files) {
    var list = Array.prototype.slice.call(files || []);
    if (!list.length) return;
    if (photos.length + list.length > MAX_PHOTOS) {
      showWarn('แนบได้สูงสุด ' + MAX_PHOTOS + ' รูป — ระบบจะรับเฉพาะรูปแรก ๆ เท่านั้น');
      list = list.slice(0, Math.max(0, MAX_PHOTOS - photos.length));
    }
    if (!list.length) return;
    info.textContent = 'กำลังย่อรูป...';
    Promise.all(list.map(function (f) {
      return SP.prepareImage(f, 1400, 0.75).then(function (r) { return { ok: true, r: r }; })
        ['catch'](function (err) { return { ok: false, m: err.message }; });
    })).then(function (res) {
      var bad = res.filter(function (r) { return !r.ok; });
      res.filter(function (r) { return r.ok; }).forEach(function (x) { photos.push(x.r); });
      if (bad.length) showWarn('มี ' + bad.length + ' ไฟล์ที่ใช้ไม่ได้: ' + bad[0].m);
      paintPhotos();
    });
  }

  fileInput.addEventListener('change', function () { addFiles(this.files); this.value = ''; });
  ['dragenter', 'dragover'].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('over'); });
  });
  dz.addEventListener('drop', function (e) { addFiles(e.dataTransfer && e.dataTransfer.files); });

  thumbs.addEventListener('click', function (e) {
    var rm = e.target.closest('[data-rm]');
    if (rm) {
      var gone = photos.splice(+rm.getAttribute('data-rm'), 1)[0];
      if (gone && gone.url) { try { URL.revokeObjectURL(gone.url); } catch (er) { } }
      paintPhotos(); return;
    }
    var im = e.target.closest('img[data-i]');
    if (im) openBox(im.src);
  });

  /* ---- ดูรูปเต็ม ---- */
  var lb = document.getElementById('lightbox');
  function openBox(src) { lb.querySelector('img').src = src; lb.classList.add('show'); }
  lb.addEventListener('click', function () { lb.classList.remove('show'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') lb.classList.remove('show'); });

  paintPhotos();

  /* ---- ส่ง ---- */
  document.getElementById('problemForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var ok = true;
    probSel.closest('.field').classList.toggle('invalid', !probSel.value); if (!probSel.value) ok = false;
    placeSel.closest('.field').classList.toggle('invalid', !placeSel.value); if (!placeSel.value) ok = false;
    var sev = document.querySelector('input[name=sev]:checked');
    document.getElementById('sevErr').style.display = sev ? 'none' : 'block';
    if (!sev) ok = false;
    if (!ok) { SP.toast('กรุณากรอกข้อมูลให้ครบ'); return; }

    var problem = probSel.value, place = placeSel.value;
    var op = document.getElementById('otherProblem').value.trim();
    var opl = document.getElementById('otherPlace').value.trim();
    if (problem === 'อื่น ๆ' && op) problem = 'อื่น ๆ: ' + op;
    if (place === 'อื่น ๆ' && opl) place = 'อื่น ๆ: ' + opl;

    /* บันทึกรูปลงคลังรูป (IndexedDB) แล้วเก็บเฉพาะรหัสรูปไว้ในข้อมูล */
    var btn = this.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'กำลังบันทึก...';

    function fallbackDataUrl(blob) {
      return new Promise(function (res) {
        var fr = new FileReader();
        fr.onload = function () { res(String(fr.result)); };
        fr.onerror = function () { res(''); };
        fr.readAsDataURL(blob);
      });
    }

    Promise.all(photos.map(function (p) {
      return SP.Img.put(p.blob)['catch'](function () { return fallbackDataUrl(p.blob); });
    })).then(function (refs) {
      refs = refs.filter(Boolean);
      var st = SP.stamp();
      var rec = {
        id: 'p' + Date.now() + Math.floor(Math.random() * 999),
        iso: st.iso, date: st.date, time: st.time,
        sid: me.sid, name: me.name, room: me.room, no: me.no,
        problem: problem, place: place,
        severity: +sev.value,
        detail: document.getElementById('detail').value.trim(),
        photos: refs,
        status: 'wait',
        history: [{ status: 'wait', iso: st.iso, date: st.date, time: st.time, by: 'ระบบ', note: 'รับเรื่องเข้าระบบแล้ว' }]
      };
      var all = SP.list(SP.KEY.PROBLEM);
      all.push(rec);
      if (!SP.write(SP.KEY.PROBLEM, all)) {
        btn.disabled = false; btn.textContent = 'ส่งรายงานปัญหา';
        showWarn('บันทึกไม่สำเร็จ — พื้นที่จัดเก็บของเบราว์เซอร์เต็ม กรุณาแจ้งคณะกรรมการสภานักเรียน');
        SP.toast('บันทึกไม่สำเร็จ');
        return;
      }
      SP.go('#intex2.1?from=problem');
    })['catch'](function (err) {
      btn.disabled = false; btn.textContent = 'ส่งรายงานปัญหา';
      showWarn('บันทึกรูปไม่สำเร็จ: ' + err.message);
    });
  });
  }
};

PAGES['intex9'] = {
  nav: 'student', active: 'intex9', footer: true,
  title: "สถานะการแจ้งปัญหา | สภานักเรียนโรงเรียนร้องกวางอนุสรณ์",
  init: function () {
  if (!SP.Student.guard()) return;
  var me = SP.Student.current();

  var fStatus = document.getElementById('fStatus'), fSev = document.getElementById('fSev'),
      search = document.getElementById('search'), host = document.getElementById('cases');

  SP.STATUSES.forEach(function (s) {
    var o = document.createElement('option'); o.value = s.k; o.textContent = s.ico + ' ' + s.name; fStatus.appendChild(o);
  });
  SP.SEVERITIES.forEach(function (s) {
    var o = document.createElement('option'); o.value = s.n; o.textContent = 'ระดับ ' + s.n + ' · ' + s.name; fSev.appendChild(o);
  });

  function mine() {
    return SP.list(SP.KEY.PROBLEM)
      .filter(function (r) { return String(r.sid) === String(me.sid); })
      .sort(function (a, b) { return (b.iso || '').localeCompare(a.iso || ''); });
  }

  function sevDots(n) {
    var out = '';
    for (var i = 1; i <= 5; i++) out += '<i class="' + (i <= n ? 'on' : '') + '"></i>';
    return '<span class="sev-dots">' + out + '</span>';
  }

  function timeline(rec) {
    var order = SP.STATUSES.map(function (s) { return s.k; });
    var curIdx = order.indexOf(rec.status || 'wait');
    var hist = rec.history || [];
    return '<ul class="tl">' + SP.STATUSES.map(function (s, i) {
      var h = null;
      for (var k = hist.length - 1; k >= 0; k--) if (hist[k].status === s.k) { h = hist[k]; break; }
      var cls = i < curIdx ? 'on' : (i === curIdx ? 'cur' : '');
      return '<li class="' + cls + '">' +
        '<div class="t-name">' + s.ico + ' ' + SP.esc(s.name) + '</div>' +
        '<div class="t-when">' + (h ? SP.esc(h.date + ' ' + h.time) + (h.by ? ' · โดย ' + SP.esc(h.by) : '') : '—') + '</div>' +
        (h && h.note ? '<div class="t-when">“' + SP.esc(h.note) + '”</div>' : '') +
        '</li>';
    }).join('') + '</ul>';
  }

  function render() {
    var all = mine();
    var q = (search.value || '').trim().toLowerCase();
    var view = all.filter(function (r) {
      if (fStatus.value && (r.status || 'wait') !== fStatus.value) return false;
      if (fSev.value && String(r.severity || 3) !== fSev.value) return false;
      if (!q) return true;
      return ((r.problem || '') + ' ' + (r.place || '') + ' ' + (r.detail || '')).toLowerCase().indexOf(q) > -1;
    });

    /* สรุปจำนวนตามสถานะ */
    document.getElementById('counts').innerHTML = SP.STATUSES.map(function (s) {
      var n = all.filter(function (r) { return (r.status || 'wait') === s.k; }).length;
      return '<div class="stat"><h3>' + s.ico + ' ' + SP.esc(s.name) + '</h3>' +
        '<div class="headline" style="margin:0">' + n +
        ' <span style="font-size:.9rem;font-weight:600;color:var(--ink-muted)">เรื่อง</span></div></div>';
    }).join('');

    if (!view.length) {
      host.innerHTML = '<div class="card"><div class="empty-state"><span class="big">📭</span>' +
        (all.length ? 'ไม่พบเรื่องที่ค้นหา' :
          'คุณยังไม่เคยแจ้งปัญหา — <a href="#intex4">แจ้งปัญหาแรกของคุณ</a>') + '</div></div>';
      return;
    }

    host.innerHTML = view.map(function (r) {
      var st = SP.statusOf(r.status || 'wait');
      var sv = SP.severityOf(r.severity || 3);
      var photos = (r.photos || []).map(function (ref, i) {
        return '<div class="thumb thumb-sm"><img data-photo="' + SP.esc(ref) + '" alt="รูปที่ ' + (i + 1) + '"></div>';
      }).join('');
      return '<article class="case">' +
        '<div class="case-head">' +
          '<h3>' + SP.esc(r.problem) + '</h3>' +
          '<span class="status-pill ' + st.cls + '">' + st.ico + ' ' + SP.esc(st.name) + '</span>' +
          '<span class="sev-badge ' + sv.cls + '">' + sevDots(sv.n) + ' ' + SP.esc(sv.name) + '</span>' +
        '</div>' +
        '<div class="case-meta">' +
          '<span>📍 ' + SP.esc(r.place) + '</span>' +
          '<span>🗓️ แจ้งเมื่อ ' + SP.esc(r.date) + ' ' + SP.esc(r.time) + '</span>' +
        '</div>' +
        (r.detail ? '<div class="note">' + SP.esc(r.detail) + '</div>' : '') +
        '<div class="case-body">' +
          '<div>' + timeline(r) + '</div>' +
          (photos ? '<div><div class="card-sub" style="margin-bottom:8px">รูปภาพประกอบ</div>' +
                    '<div class="thumb-row">' + photos + '</div></div>' : '') +
        '</div>' +
        '</article>';
    }).join('');

    SP.Img.paintAll(host);
  }

  var lb = document.getElementById('lightbox');
  host.addEventListener('click', function (e) {
    var im = e.target.closest('.thumb img');
    if (!im) return;
    lb.querySelector('img').src = im.src; lb.classList.add('show');
  });
  lb.addEventListener('click', function () { lb.classList.remove('show'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') lb.classList.remove('show'); });

  search.addEventListener('input', render);
  fStatus.addEventListener('change', render);
  fSev.addEventListener('change', render);
  render();

  SP.onSync(render);
  }
};

PAGES['intex5'] = {
  nav: 'student', active: 'intex5', footer: false,
  title: "เข้าสู่ระบบแอดมิน | สภานักเรียนโรงเรียนร้องกวางอนุสรณ์",
  init: function () {
  var ONLINE = SP.DB && SP.DB.live();
  var form = document.getElementById('loginForm'),
      pw = document.getElementById('pw'),
      aemail = document.getElementById('aemail'),
      errBox = document.getElementById('errBox'),
      lockBox = document.getElementById('lockBox'),
      btn = document.getElementById('loginBtn'),
      note = document.getElementById('note');

  var chip = document.getElementById('modeChip');
  chip.className = 'mode-chip ' + (ONLINE ? 'mode-online' : 'mode-local');
  chip.textContent = ONLINE ? 'ออนไลน์' : 'โหมดเครื่องเดียว';

  document.querySelectorAll(ONLINE ? '.only-local' : '.only-online')
    .forEach(function (el) { el.style.display = 'none'; });

  document.getElementById('pwToggle').addEventListener('click', function () {
    pw.type = pw.type === 'password' ? 'text' : 'password';
    this.textContent = pw.type === 'password' ? 'แสดง' : 'ซ่อน';
  });

  function fail(m) { errBox.textContent = '❌ ' + m; errBox.classList.add('show'); }

  if (SP.params().get('need')) {
    fail('กรุณาเข้าสู่ระบบก่อนเข้าใช้งานหน้าแอดมิน');
  }

  /* เข้าสู่ระบบอยู่แล้ว */
  if (SP.Admin.isIn()) { location.replace('#intex6'); return; }

  /* ================= โหมดออนไลน์ ================= */
  if (ONLINE) {
    document.getElementById('title').textContent = 'เข้าสู่ระบบแอดมิน';
    note.innerHTML = 'ใช้บัญชีแอดมินที่สร้างไว้ใน Supabase<br>' +
      '<span class="text-muted">(ถ้ายังไม่มี ดูวิธีสร้างใน README-SUPABASE.md)</span>';

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errBox.classList.remove('show');
      var em = aemail.value.trim(), p = pw.value;
      if (!SP.validEmail(em) || !p) { fail('กรุณากรอกอีเมลและรหัสผ่านให้ครบ'); return; }

      btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
      SP.DB.signIn(em, p).then(function () {
        return SP.DB.refreshRole();
      }).then(function (st) {
        if (!st.isAdmin) {
          return SP.DB.signOut().then(function () {
            throw new Error('บัญชีนี้ไม่มีสิทธิ์แอดมิน — ต้องเพิ่ม user id ลงตาราง admins ก่อน');
          });
        }
        return SP.DB.refetchAll().then(function () { location.replace('#intex6'); });
      })['catch'](function (err) {
        btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
        pw.value = '';
        var m = String(err.message || '');
        fail(/Invalid login/i.test(m) ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : m);
      });
    });
    return;
  }

  /* ================= โหมดเครื่องเดียว ================= */
  var timer;
  function refreshLock() {
    var left = SP.Admin.lockLeft();
    if (left > 0) {
      lockBox.innerHTML = '🔒 <strong>ระบบถูกล็อก</strong><br>ใส่รหัสผ่านผิดครบ 3 ครั้ง กรุณารออีก <strong>' +
        SP.Admin.fmtLeft(left) + '</strong> จึงจะเข้าสู่ระบบได้อีกครั้ง';
      lockBox.classList.add('show');
      pw.disabled = true; btn.disabled = true;
      note.textContent = 'ปลดล็อกอัตโนมัติเมื่อครบ 1 ชั่วโมง';
      clearTimeout(timer); timer = setTimeout(refreshLock, 20000);
    } else {
      lockBox.classList.remove('show');
      pw.disabled = false; btn.disabled = false;
      var lft = SP.Admin.attemptsLeft();
      note.textContent = lft < 3
        ? 'เหลือโอกาสใส่รหัสอีก ' + lft + ' ครั้ง ก่อนระบบล็อก 1 ชั่วโมง'
        : 'ใส่รหัสผิดเกิน 3 ครั้ง ระบบจะล็อกการเข้าสู่โหมดแอดมินเป็นเวลา 1 ชั่วโมง';
    }
  }
  refreshLock();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errBox.classList.remove('show');
    var r = SP.Admin.tryLogin(pw.value);
    if (r.ok) { location.href = '#intex6'; return; }
    pw.value = '';
    if (r.locked) { refreshLock(); return; }
    fail('รหัสผ่านไม่ถูกต้อง เหลือโอกาสอีก ' + r.remain + ' ครั้ง');
    refreshLock(); pw.focus();
  });
  }
};

    a.href = URL.createObjectURL(blob);
    a.download = 'sapara-backup' + (suffix || '') + '-' + new Date().toISOString().slice(0, 10) + '.json';

  document.getElementById('backupImgBtn').addEventListener('click', function () {

  document.getElementById('restoreFile').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {

        var d = JSON.parse(fr.result);
        if (!confirm('กู้คืนข้อมูลจากไฟล์นี้? ข้อมูลปัจจุบันจะถูกแทนที่ทั้งหมด')) return;
        SP.write(SP.KEY.VOTE, d.votes || []);
        SP.write(SP.KEY.MENTAL, d.mental || []);
        SP.write(SP.KEY.PROBLEM, d.problems || []);
        SP.write(SP.KEY.BUDGET, d.budget || []);
        SP.write(SP.KEY.VOTE_EXTRA, d.voteExtra || []);
        if (d.students) SP.write(SP.KEY.STUDENT, d.students);
        if (d.roster) SP.write(SP.KEY.ROSTER, d.roster);
        if (d.ratings) SP.write(SP.KEY.RATING, d.ratings);
        if (d.settings) SP.write(SP.KEY.SETTINGS, d.settings);
        if (d.images && Object.keys(d.images).length) {
          SP.toast('กำลังกู้คืนรูปภาพ...');
          var keys = Object.keys(d.images);
          var map = {};
          Promise.all(keys.map(function (oldRef) {
            return SP.Img.putDataUrl(d.images[oldRef]).then(function (newRef) { map[oldRef] = newRef; })
              ['catch'](function () { map[oldRef] = d.images[oldRef]; });
          })).then(function () {
            /* เปลี่ยนรหัสรูปเก่าในข้อมูลให้ชี้ไปรูปที่เพิ่งกู้คืน */
            var pr = SP.list(SP.KEY.PROBLEM);
            pr.forEach(function (r) {
              r.photos = (r.photos || []).map(function (x) { return map[x] || x; });
            });
            SP.write(SP.KEY.PROBLEM, pr);

    var shown = type === 'num' ? SP.fmtNum(v) : (v == null ? '' : v);

    var st = view.reduce(function (a, r) {

    }, { t: 0, a: 0, r: 0 });

      ],

  tbody.addEventListener('click', function (e) {

    save(rows().filter(function (r) { return r.id !== b.getAttribute('data-del'); }));

  });

  tbody.addEventListener('blur', function (e) {

    var id = td.getAttribute('data-id'), f = td.getAttribute('data-f'), t = td.getAttribute('data-t');
    var v = td.textContent.trim();

      var nv = t === 'num' ? (Number(v.replace(/,/g, '')) || 0) : v;
      if (String(all[i][f]) === String(nv)) return;      /* ไม่มีการเปลี่ยนแปลง ไม่ต้องวาดใหม่ */
      all[i][f] = nv;
      save(all); render(); SP.toast('บันทึกการแก้ไขแล้ว'); return;
    }
  }, true);

  search.addEventListener('input', render);
  document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
  document.getElementById('csvBtn').addEventListener('click', function () {
    SP.exportCSV('งบประมาณ-2569.csv',
      ['วันเดือนปี', 'เวลา', 'รายการ', 'งบทั้งหมด', 'จ่ายจริง', 'คงเหลือ', 'ชื่อผู้บันทึก', 'หมายเหตุ'],
      rows().map(function (r) { return [r.date, r.time, r.item, r.total, r.actual, remain(r), r.recorder, r.note || '']; }));
  });

};

    showOk(isNew ? 'เพิ่ม ' + name + ' เข้าคลังรายชื่อแล้ว' : 'อัปเดตข้อมูลของรหัส ' + sid + ' แล้ว');
    this.reset(); document.getElementById('f-name').focus();
    render();
  });

  /* ---- นำเข้า CSV ---- */
  function parseCSV(text) {
    text = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n');
    var rows = [], row = [], cur = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ''; }); });
  }

  document.getElementById('csvFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var rows = parseCSV(String(fr.result));
        if (!rows.length) { showErr('ไฟล์ว่างเปล่า'); return; }
        /* ข้ามบรรทัดหัวตารางถ้าคอลัมน์แรกไม่ใช่ตัวเลข */
        if (!/^\d/.test(String(rows[0][0]).trim())) rows.shift();
        var added = 0, updated = 0, skipped = 0;
        rows.forEach(function (r) {
          var sid = String(r[0] || '').trim(), name = String(r[1] || '').trim(),
              room = String(r[2] || '').trim(), no = String(r[3] || '').trim();
          if (!sid || !name || !room || !no) { skipped++; return; }
          if (SP.Roster.add({ sid: sid, name: name, room: room, no: no })) added++; else updated++;
        });
        showOk('นำเข้าเสร็จแล้ว — เพิ่มใหม่ ' + added + ' คน · อัปเดต ' + updated + ' คน' +
               (skipped ? ' · ข้าม ' + skipped + ' แถวที่ข้อมูลไม่ครบ' : ''));
        render();
      } catch (err) { showErr('อ่านไฟล์ไม่สำเร็จ: ' + err.message); }
    };
    fr.onerror = function () { showErr('อ่านไฟล์ไม่สำเร็จ'); };
    fr.readAsText(f, 'utf-8');
  });

  document.getElementById('tplBtn').addEventListener('click', function () {
    SP.exportCSV('ตัวอย่างรายชื่อนักเรียน.csv',
      ['รหัสนักเรียน', 'ชื่อ-นามสกุล', 'ชั้น', 'เลขที่'],
      [['20001', 'เด็กหญิงกวางน้อย ใจดี', SP.ROOMS[0], '1'],
       ['20002', 'เด็กชายภูผา รักเรียน', SP.ROOMS[0], '2']]);
  });

  /* ---- ลบ / ล้าง / ส่งออก ---- */
  tbody.addEventListener('click', function (e) {
    var b = e.target.closest('[data-del]'); if (!b) return;
    var sid = b.getAttribute('data-del');
    if (!confirm('ลบรหัส ' + sid + ' ออกจากคลังรายชื่อ?\nถ้านักเรียนคนนี้ลงทะเบียนไว้แล้ว บัญชีจะยังอยู่ แต่จะเข้าสู่ระบบไม่ได้เมื่อเปิดการตรวจสอบ')) return;
    SP.Roster.remove(sid);

  document.getElementById('clearBtn').addEventListener('click', function () {
    if (!confirm('ล้างคลังรายชื่อทั้งหมด?\nบัญชีที่ลงทะเบียนไว้แล้วจะไม่ถูกลบ')) return;

    SP.Roster.save([]); SP.toast('ล้างคลังรายชื่อแล้ว'); render();
  });

  document.getElementById('csvBtn').addEventListener('click', function () {
    var reg = regMap();
    SP.exportCSV('คลังรายชื่อนักเรียน-2569.csv',
      ['รหัสนักเรียน', 'ชื่อ-นามสกุล', 'ชั้น', 'เลขที่', 'สถานะบัญชี', 'อีเมลที่ลงทะเบียน'],

      }));
  });

  search.addEventListener('input', render);
  fRoom.addEventListener('change', render);
  fReg.addEventListener('change', render);
  render();

  SP.onSync(render);
  }
};
