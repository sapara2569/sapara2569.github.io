  /* แบรนด์สีม่วง */
  --brand-950:#2e1065; --brand-900:#3b0764; --brand-800:#4c1d95;
  --brand-700:#5b21b6; --brand-600:#6d28d9; --brand-500:#7c3aed;
  --brand-400:#8b5cf6; --brand-300:#a78bfa; --brand-200:#c4b5fd;
  --brand-100:#ede9fe; --brand-50:#f5f3ff;
  /* ทอง */
  --gold-300:#fde68a; --gold-500:#f2c94c; --gold-700:#d4a017;
  /* ตัวอักษร */
  --ink:#12101a; --ink-2:#52514e; --ink-muted:#7a7889;
  /* พื้นผิว */
  --surface:#ffffff; --surface-2:#faf9ff; --page:#f6f4fb;
  --line:#e6e3f0; --line-strong:#d3cee4;
  /* กราฟ (ผ่านการตรวจ contrast/CVD แล้ว) */
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
  --series-solo:#5b21b6;
  --grid:#e6e3f0; --axis:#c9c4dc;
  /* สถานะ */
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --radius:14px; --radius-sm:9px;
  --shadow-1:0 1px 2px rgba(18,16,26,.06), 0 4px 14px rgba(18,16,26,.06);
  --shadow-2:0 8px 28px rgba(59,7,100,.14);
  --font:"Sarabun","Noto Sans Thai","Prompt",system-ui,-apple-system,"Segoe UI",sans-serif;
  --topbar-h:60px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--font); color:var(--ink);
  background:var(--page); font-size:16px; line-height:1.6;
  min-height:100vh; display:flex; flex-direction:column;
}
h1,h2,h3,h4{margin:0 0 .4em; line-height:1.3; font-weight:700; letter-spacing:-.01em}
h1{font-size:clamp(1.55rem,1.1rem + 1.7vw,2.3rem)}
h2{font-size:clamp(1.2rem,1rem + .8vw,1.6rem)}
h3{font-size:1.08rem}
p{margin:0 0 .9em}
a{color:var(--brand-700)}
:focus-visible{outline:3px solid var(--brand-400); outline-offset:2px; border-radius:6px}

/* ---------- 2. แถบด้านบน หนา 30px สีม่วง ---------- */
.topbar{
  height:var(--topbar-h); min-height:var(--topbar-h);
  background:linear-gradient(90deg,var(--brand-900) 0%,var(--brand-700) 45%,var(--brand-500) 100%);
  position:sticky; top:0; z-index:60;
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 2px 10px rgba(46,16,101,.28);
}
.topbar-inner{
  height:var(--topbar-h); max-width:1700px; margin:0 auto; padding:0 12px;
  display:flex; align-items:center; gap:10px;
}
.brand{display:flex; align-items:center; gap:6px; flex:0 0 auto}
.brand-logo{height:50px; width: 50px; display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.brand-name{
  color:#fff; font-size:12px; font-weight:700; white-space:nowrap;
  letter-spacing:.01em; opacity:.95; margin-left:2px;
}
.topnav{
  margin-left:auto; display:flex; align-items:center; gap:2px;
  overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;
  max-width:100%;
}
.topnav::-webkit-scrollbar{display:none}
.topnav a{
  color:#f1e9ff; text-decoration:none; font-size:12.5px; font-weight:600;
  line-height:var(--topbar-h); padding:0 9px; white-space:nowrap;
  border-radius:0; transition:background .16s ease,color .16s ease; position:relative;
}
.topnav a:hover{background:rgba(255,255,255,.16); color:#fff}
.topnav a.is-active{background:rgba(255,255,255,.24); color:#fff}
.topnav a.is-active::after{
  content:""; position:absolute; left:6px; right:6px; bottom:0; height:2.5px;
  background:var(--gold-500); border-radius:2px 2px 0 0;
}
.topnav a.nav-exit{color:var(--gold-300)}

/* ---------- 3. ส่วนหัวหน้า (masthead) ---------- */
.masthead{
  background:linear-gradient(180deg,#fff 0%,var(--brand-50) 100%);
  border-bottom:1px solid var(--line);
}
.masthead-inner{
  max-width:1240px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.masthead-logo{height:46px; width:46px}
.masthead-text strong{display:block; font-size:1.05rem; color:var(--brand-900); line-height:1.25}
.masthead-text span{display:block; font-size:.82rem; color:var(--ink-muted)}
.masthead .pill{margin-left:auto}
.pill{
  display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:700;
  background:var(--brand-100); color:var(--brand-800);
  border:1px solid var(--brand-200); padding:4px 11px; border-radius:999px;
}
.pill.pill-admin{background:#fff7e0; color:#8a5a00; border-color:#f0d79a}

/* ---------- 4. เลย์เอาต์ ---------- */
main{flex:1 0 auto}
.wrap{max-width:1240px; margin:0 auto; padding:26px 20px 56px}
.wrap-narrow{max-width:860px}
.page-head{margin-bottom:20px}
.page-head p{color:var(--ink-2); max-width:70ch; margin:0}
.grid{display:grid; gap:18px}
@media(min-width:760px){ .grid-2{grid-template-columns:repeat(2,1fr)} }
@media(min-width:1000px){ .grid-3{grid-template-columns:repeat(3,1fr)} }

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px; box-shadow:var(--shadow-1);
}
.card + .card{margin-top:18px}
.card-title{
  display:flex; align-items:center; gap:9px; margin:0 0 4px;
  font-size:1.12rem; font-weight:700; color:var(--brand-900);
}
.card-title .dot{width:9px; height:9px; border-radius:3px; background:var(--brand-500); flex:0 0 auto}
.card-sub{color:var(--ink-muted); font-size:.88rem; margin:0 0 16px}
.section-divider{height:1px; background:var(--line); border:0; margin:22px 0}

/* ---------- 5. หน้าหลัก (พื้นหลังกวาง) ---------- */
.hero{
  position:relative; color:#fff; overflow:hidden;
  background:#3b0764 var(--bg-deer) center/cover no-repeat;
  min-height:min(64vh,520px); display:flex; align-items:center;
}
.hero::before{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(46,16,101,.62) 0%,rgba(46,16,101,.30) 45%,rgba(46,16,101,.72) 100%);
}
.hero-inner{position:relative; max-width:1240px; margin:0 auto; padding:56px 20px; width:100%}
.hero-badges{display:flex; gap:12px; align-items:center; margin-bottom:16px}
.hero-badges img{height:120px; width:120px; filter:drop-shadow(0 4px 12px rgba(0,0,0,.45))}
.hero h1{color:#fff; text-shadow:0 3px 18px rgba(0,0,0,.5); margin-bottom:.3em}
.hero .lead{font-size:1.05rem; color:#ece4ff; max-width:60ch; text-shadow:0 2px 10px rgba(0,0,0,.45)}
.hero-cta{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px}
.page-deer{
  background:#3b0764 var(--bg-deer) center/cover fixed no-repeat;
}

/* การ์ดเมนูหน้าหลัก */
.tile{
  display:block; text-decoration:none; color:inherit; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); padding:20px;
  box-shadow:var(--shadow-1); transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  position:relative; overflow:hidden;
}
.tile::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--brand-500)}
.tile:hover{transform:translateY(-3px); box-shadow:var(--shadow-2); border-color:var(--brand-200)}
.tile .ico{
  width:42px; height:42px; border-radius:12px; background:var(--brand-100); color:var(--brand-700);
  display:grid; place-items:center; font-size:20px; margin-bottom:12px;
}
.tile h3{margin:0 0 4px; color:var(--brand-900)}
.tile p{margin:0; color:var(--ink-2); font-size:.9rem}
.tile .go{display:inline-block; margin-top:12px; color:var(--brand-700); font-weight:700; font-size:.88rem}

/* ---------- 6. ฟอร์ม ---------- */
.form-grid{display:grid; gap:14px}
@media(min-width:700px){ .form-grid.cols-2{grid-template-columns:1fr 1fr} .form-grid .span-2{grid-column:1/-1} }
@media(min-width:700px){ .form-grid.cols-4{grid-template-columns:repeat(4,1fr)} }
.field{display:flex; flex-direction:column; gap:6px}
.field > label{font-weight:600; font-size:.9rem; color:var(--ink)}
.field .hint{font-size:.78rem; color:var(--ink-muted)}
.req{color:var(--critical); font-weight:700}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=email],select,textarea{
  width:100%; font:inherit; font-size:.95rem; color:var(--ink);
  background:var(--surface); border:1.5px solid var(--line-strong);
  border-radius:var(--radius-sm); padding:10px 12px; transition:border-color .15s, box-shadow .15s;
}
select{
  appearance:none; padding-right:38px; cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b21b6' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:right 11px center; background-size:17px;
}
textarea{min-height:104px; resize:vertical}
input:focus,select:focus,textarea:focus{
  outline:none; border-color:var(--brand-500); box-shadow:0 0 0 3.5px rgba(124,58,237,.16);
}
input:disabled,select:disabled,textarea:disabled{background:#f2f1f6; color:var(--ink-muted); cursor:not-allowed}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--critical)}
.err-msg{color:var(--critical); font-size:.8rem; font-weight:600; display:none}
.field.invalid .err-msg{display:block}

/* ---------- 7. ตัวเลือก 5 ระดับ (Likert) ---------- */
.likert{display:grid; gap:8px; grid-template-columns:repeat(5,1fr)}
.likert input{position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0;
  overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap}
.likert label{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  text-align:center; padding:9px 4px; min-height:62px; cursor:pointer;
  border:1.5px solid var(--line-strong); border-radius:var(--radius-sm);
  background:var(--surface-2); font-size:.76rem; color:var(--ink-2);
  transition:.15s ease; line-height:1.25;
}
.likert label .num{font-size:1rem; font-weight:800; color:var(--brand-700)}
.likert label:hover{border-color:var(--brand-300); background:var(--brand-50)}
.likert input:checked + label{
  background:var(--brand-600); border-color:var(--brand-700); color:#fff; box-shadow:var(--shadow-2);
}
.likert input:checked + label .num{color:#fff}
.likert input:focus-visible + label{outline:3px solid var(--brand-400); outline-offset:2px}
@media(max-width:560px){
  .likert{grid-template-columns:1fr}
  .likert label{flex-direction:row; justify-content:flex-start; gap:10px; min-height:0; padding:9px 12px; font-size:.86rem}
}

/* คำถามแบบประเมิน */
.q-item{padding:16px 0; border-top:1px solid var(--line)}
.q-item:first-of-type{border-top:0; padding-top:4px}
.q-text{display:flex; gap:10px; font-weight:600; margin-bottom:11px; font-size:.97rem}
.q-no{
  flex:0 0 auto; width:26px; height:26px; border-radius:8px; background:var(--brand-100);
  color:var(--brand-800); display:grid; place-items:center; font-size:.82rem; font-weight:800;
}

/* ---------- 8. ปุ่ม ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font:inherit; font-weight:700; font-size:.95rem; cursor:pointer;
  padding:11px 22px; border-radius:999px; border:1.5px solid transparent;
  text-decoration:none; transition:.16s ease; line-height:1.2;
}
.btn-primary{background:linear-gradient(135deg,var(--brand-600),var(--brand-800)); color:#fff; box-shadow:var(--shadow-2)}
.btn-primary:hover{filter:brightness(1.08); transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{background:var(--surface); color:var(--brand-800); border-color:var(--brand-200)}
.btn-ghost:hover{background:var(--brand-50); border-color:var(--brand-400)}
.btn-light{background:rgba(255,255,255,.94); color:var(--brand-900)}
.btn-light:hover{background:#fff}
.btn-gold{background:linear-gradient(135deg,var(--gold-500),var(--gold-700)); color:#3b2500}
.btn-sm{padding:7px 14px; font-size:.85rem}
.btn-danger{background:#fff; color:var(--critical); border-color:#f0c2c2}
.btn-danger:hover{background:#fdf2f2}
.btn:disabled,.btn[aria-disabled=true]{opacity:.5; cursor:not-allowed; transform:none; filter:none}
.btn-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:22px}
.btn-row.end{justify-content:flex-end}

/* ---------- 9. หน้าแจ้งสถานะการส่ง ---------- */
.status-page{display:grid; place-items:center; padding:44px 20px}
.status-card{
  background:var(--surface); border:1px solid var(--line); border-radius:22px;
  box-shadow:var(--shadow-2); padding:40px 32px; max-width:680px; width:100%; text-align:center;
}
.check-icon{
  width:96px; height:96px; margin:0 auto 18px; border-radius:50%;
  background:#e8f8ec; border:3px solid var(--good); display:grid; place-items:center;
  animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;
}
.check-icon svg{width:52px; height:52px; stroke:var(--good); stroke-width:4.2; fill:none;
  stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:48; stroke-dashoffset:48;
  animation:draw .5s .22s ease-out forwards}
@keyframes pop{from{transform:scale(.5); opacity:0} to{transform:scale(1); opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){
  .check-icon,.check-icon svg{animation:none} .check-icon svg{stroke-dashoffset:0}
}
.status-card h1{color:var(--good); margin-bottom:.2em}
.status-meta{color:var(--ink-muted); font-size:.9rem}

/* กล่องผลการประเมิน */
.result-box{
  border-radius:var(--radius); padding:22px; margin:22px 0; text-align:left;
  border:1.5px solid var(--line); background:var(--surface-2);
}
.result-level{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px}
.level-badge{
  display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:1rem;
  padding:8px 16px; border-radius:999px; border:1.5px solid;
}
.level-1{background:#e8f8ec; color:#0a6b0a; border-color:#a8dcb4}
.level-2{background:#eefaf1; color:#136c31; border-color:#b7e2c5}
.level-3{background:#fff8e5; color:#7a5300; border-color:#f0d79a}
.level-4{background:#fdeee6; color:#8f3f16; border-color:#f3c4ab}
.level-5{background:#fdecec; color:#8c1f1f; border-color:#f0b6b6}
.score-chip{font-size:.85rem; font-weight:700; color:var(--ink-2); background:#fff;
  border:1px solid var(--line-strong); padding:5px 12px; border-radius:999px}
.advice ul{margin:.5em 0 0; padding-left:1.25em}
.advice li{margin-bottom:.4em}
.callout{
  border-left:4px solid var(--brand-500); background:var(--brand-50);
  padding:13px 16px; border-radius:0 var(--radius-sm) var(--radius-sm) 0; font-size:.9rem; color:var(--ink-2);
}
.callout.warn{border-left-color:var(--warn); background:#fff8e5}
.callout.danger{border-left-color:var(--critical); background:#fdecec}

/* ---------- 10. ตาราง ---------- */
.table-tools{display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-bottom:13px}
.table-tools .spacer{margin-left:auto}
.search-box{position:relative; min-width:210px}
.search-box input{padding-left:34px}
.search-box::before{
  content:""; position:absolute; left:11px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; opacity:.55;
  background:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2352514e' stroke-width='2.4' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M20 20l-4-4'/%3E%3C/svg%3E") no-repeat center/contain;
}
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface)}
table.data{width:100%; border-collapse:collapse; font-size:.9rem; min-width:640px}
table.data caption{
  caption-side:top; text-align:left; padding:14px 16px 12px; font-weight:800;
  font-size:1.05rem; color:var(--brand-900); border-bottom:1px solid var(--line);
}
table.data th,table.data td{padding:10px 13px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top}
table.data thead th{
  background:var(--brand-800); color:#fff; font-weight:700; font-size:.83rem;
  position:sticky; top:0; white-space:nowrap; border-bottom:0;
}
table.data thead th:first-child{border-top-left-radius:0}
table.data tbody tr:nth-child(even){background:var(--surface-2)}
table.data tbody tr:hover{background:var(--brand-50)}
table.data tbody tr:last-child td{border-bottom:0}
table.data td.num,table.data th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
table.data tfoot td{background:var(--brand-100); font-weight:800; color:var(--brand-900); border-top:2px solid var(--brand-200)}
table.data td[contenteditable=true]{cursor:text}
table.data td[contenteditable=true]:focus{outline:2px solid var(--brand-400); outline-offset:-2px; background:#fff}
.row-del{
  background:none; border:0; color:var(--critical); cursor:pointer; font-size:1.05rem;
  line-height:1; padding:3px 7px; border-radius:6px;
}
.row-del:hover{background:#fdecec}
.empty-state{padding:34px 20px; text-align:center; color:var(--ink-muted); font-size:.92rem}
.empty-state .big{font-size:2rem; display:block; margin-bottom:6px; opacity:.5}
.tag{display:inline-block; padding:2px 9px; border-radius:999px; font-size:.76rem; font-weight:700;
  background:var(--brand-100); color:var(--brand-800); border:1px solid var(--brand-200)}

/* ---------- 11. กราฟ ---------- */
.chart-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; box-shadow:var(--shadow-1); margin-top:18px;
}
.chart-head{margin-bottom:4px}
.chart-title{font-size:1.02rem; font-weight:700; color:var(--ink); margin:0}
.chart-sub{font-size:.83rem; color:var(--ink-muted); margin:2px 0 0}
.chart-legend{display:flex; flex-wrap:wrap; gap:14px; margin:12px 0 6px}
.chart-legend .lg{display:inline-flex; align-items:center; gap:7px; font-size:.83rem; color:var(--ink-2); font-weight:600}
.chart-legend .sw{width:11px; height:11px; border-radius:3px; flex:0 0 auto}
.chart-holder{position:relative; width:100%}
.chart-holder svg{display:block; width:100%; height:auto; overflow:visible}
.chart-tip{
  position:absolute; pointer-events:none; z-index:5; opacity:0; transition:opacity .12s;
  background:#fff; border:1px solid var(--line-strong); border-radius:10px;
  box-shadow:var(--shadow-2); padding:9px 12px; font-size:.83rem; min-width:120px;
  transform:translate(-50%,-114%); white-space:nowrap;
}
.chart-tip.show{opacity:1}
.chart-tip .t-cat{font-weight:800; color:var(--ink); display:block; margin-bottom:5px}
.chart-tip .t-row{display:flex; align-items:center; gap:7px; color:var(--ink-2)}
.chart-tip .t-row .sw{width:9px; height:9px; border-radius:2px}
.chart-tip .t-row b{margin-left:auto; color:var(--ink); font-variant-numeric:tabular-nums}
.bar-rect{transition:opacity .12s}
.chart-holder.dim .bar-rect{opacity:.42}
.chart-holder .bar-rect.hot{opacity:1}

/* ---------- 12. สรุป (มิเตอร์) ---------- */
.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; box-shadow:var(--shadow-1);
}
.stat h3{display:flex; align-items:center; gap:8px; font-size:1rem; color:var(--brand-900); margin-bottom:14px}
.stat .headline{font-size:1.5rem; font-weight:800; color:var(--ink); line-height:1.25; margin-bottom:3px}
.stat .sub{font-size:.85rem; color:var(--ink-muted); margin-bottom:14px}
.meter-row{margin-bottom:12px}
.meter-row:last-child{margin-bottom:0}
.meter-label{display:flex; gap:10px; font-size:.85rem; margin-bottom:5px; color:var(--ink-2)}
.meter-label .v{margin-left:auto; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums}
.meter{height:13px; background:var(--brand-100); border-radius:999px; overflow:hidden}
.meter > span{display:block; height:100%; border-radius:999px;
  background:linear-gradient(90deg,var(--brand-500),var(--brand-800)); transition:width .5s ease}
.meter.m-1 > span{background:linear-gradient(90deg,#5ea0e8,var(--series-1))}
.meter.m-2 > span{background:linear-gradient(90deg,#f0916a,var(--series-2))}
.meter.m-3 > span{background:linear-gradient(90deg,#5fc9a2,var(--series-3))}

/* ---------- 13. เข้าสู่ระบบแอดมิน ---------- */
.login-shell{
  min-height:calc(100vh - var(--topbar-h)); display:grid; place-items:center; padding:36px 20px;
  background:#3b0764 var(--bg-deer) center/cover no-repeat;
}
.login-card{
  width:100%; max-width:440px; background:rgba(255,255,255,.97); backdrop-filter:blur(6px);
  border-radius:20px; padding:34px 30px; box-shadow:0 22px 60px rgba(20,4,45,.45); text-align:center;
}
.login-card img{height:64px; width:64px; margin-bottom:12px}
.login-card h1{font-size:1.4rem; color:var(--brand-900)}
.login-card .field{text-align:left; margin-top:18px}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px; letter-spacing:.14em}
.pw-toggle{position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none;
  border:0; cursor:pointer; font-size:1rem; padding:6px 8px; border-radius:7px; line-height:1}
.pw-toggle:hover{background:var(--brand-50)}
.attempt-note{font-size:.83rem; color:var(--ink-muted); margin-top:12px}
.alert{
  display:none; margin-top:14px; padding:11px 14px; border-radius:var(--radius-sm);
  font-size:.88rem; font-weight:600; text-align:left;
}
.alert.show{display:block}
.alert-err{background:#fdecec; color:#8c1f1f; border:1px solid #f0b6b6}
.alert-lock{background:#fff8e5; color:#7a5300; border:1px solid #f0d79a}

/* ---------- 14. Footer ---------- */
.site-footer{
  background:var(--brand-950); color:#cdbdf0; padding:22px 20px; font-size:.83rem; margin-top:auto;
}
.site-footer .inner{max-width:1240px; margin:0 auto; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.site-footer strong{color:#fff}
.site-footer .right{margin-left:auto; text-align:right}
.site-footer .right p{margin:0; line-height:1.5}

/* ---------- 15. Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); z-index:200;
  background:var(--brand-900); color:#fff; padding:11px 20px; border-radius:999px;
  font-size:.88rem; font-weight:600; box-shadow:var(--shadow-2);
  opacity:0; pointer-events:none; transition:.25s ease;
}
.toast.show{opacity:1; transform:translate(-50%,0)}

/* ---------- 16. Utilities ---------- */
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0}
.text-muted{color:var(--ink-muted)}
.mt-0{margin-top:0}.mt-2{margin-top:14px}.mb-0{margin-bottom:0}
.nowrap{white-space:nowrap}
.no-storage-note{
  display:none; background:#fff8e5; border:1px solid #f0d79a; color:#7a5300;
  padding:11px 15px; border-radius:var(--radius-sm); font-size:.87rem; margin-bottom:16px;
}
.no-storage-note.show{display:block}

/* ---------- 17. พิมพ์ / PDF (A4 แนวตั้ง) ---------- */
@page{size:A4 portrait; margin:14mm 12mm}
@media print{
  :root{--shadow-1:none;--shadow-2:none}
  body{background:#fff; font-size:11.5pt}
  .topbar,.site-footer,.no-print,.btn,.table-tools,.chart-tip,.toast,.masthead .pill{display:none !important}
  .wrap{padding:0; max-width:none}
  .print-header{display:block !important; border-bottom:2.5px solid var(--brand-800); padding-bottom:9px; margin-bottom:16px}
  .card,.chart-card,.stat,.table-wrap{
    border:1px solid #c9c4dc !important; box-shadow:none !important;
    break-inside:avoid; page-break-inside:avoid; margin-bottom:12px;
  }
  .print-break{break-before:page; page-break-before:always}
  table.data{font-size:9.5pt; min-width:0}
  table.data thead th{background:#4c1d95 !important; color:#fff !important;
    -webkit-print-color-adjust:exact; print-color-adjust:exact; position:static}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  a[href]::after{content:""}
  .grid-2{grid-template-columns:1fr 1fr !important}
  .grid-3{grid-template-columns:repeat(3,1fr) !important}
  .stat{padding:12px}
  .card{padding:14px}
  h1{font-size:17pt} h2{font-size:13.5pt}
}
.print-header{display:none}

/* ============================================================
   18. ระบบนักเรียน — เข้าสู่ระบบ / ลงทะเบียน / OTP / โปรไฟล์
   ============================================================ */
.nav-sep{width:1px; height:16px; background:rgba(255,255,255,.32); margin:0 5px; flex:0 0 auto}
.topnav a.nav-in{color:var(--gold-300); font-weight:700}

/* กล่องฟอร์มกลางจอบนพื้นหลังกวาง */
.auth-shell{
  min-height:calc(100vh - var(--topbar-h)); display:grid; place-items:center; padding:34px 18px;
  background:#3b0764 var(--bg-deer) center/cover no-repeat;
}
.auth-card{
  width:100%; max-width:560px; background:rgba(255,255,255,.975); backdrop-filter:blur(6px);
  border-radius:22px; padding:32px 30px; box-shadow:0 22px 60px rgba(20,4,45,.45);
}
.auth-head{text-align:center; margin-bottom:20px}
.auth-head img{height:58px; width:58px; margin:0 4px}
.auth-head h1{font-size:1.35rem; color:var(--brand-900); margin:12px 0 4px}
.auth-head p{color:var(--ink-muted); font-size:.88rem; margin:0}

/* แท็บสลับ เข้าสู่ระบบ / ลงทะเบียน */
.tabs{
  display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px;
  background:var(--brand-100); border-radius:999px; margin-bottom:22px;
}
.tabs button{
  font:inherit; font-weight:700; font-size:.92rem; cursor:pointer; padding:9px 10px;
  border:0; border-radius:999px; background:transparent; color:var(--brand-800); transition:.16s;
}
.tabs button:hover{background:rgba(255,255,255,.6)}
.tabs button[aria-selected=true]{background:var(--surface); color:var(--brand-900); box-shadow:var(--shadow-1)}
.tab-panel[hidden]{display:none}

/* ช่องกรอก OTP 6 หลัก */
.otp-inputs{display:flex; gap:9px; justify-content:center; margin:6px 0 4px}
.otp-inputs input{
  width:48px; height:58px; text-align:center; font-size:1.5rem; font-weight:800;
  padding:0; letter-spacing:0; color:var(--brand-900); font-variant-numeric:tabular-nums;
  border:1.5px solid var(--line-strong); border-radius:12px; background:var(--surface-2);
}
.otp-inputs input:focus{background:#fff}
.otp-inputs input.filled{border-color:var(--brand-500); background:#fff}
@media(max-width:420px){ .otp-inputs input{width:42px; height:52px; font-size:1.25rem} .otp-inputs{gap:6px} }

.otp-demo{
  background:linear-gradient(135deg,#fff8e5,#fff3d0); border:1.5px dashed var(--gold-700);
  border-radius:var(--radius); padding:15px 18px; text-align:center; margin:16px 0;
}
.otp-demo .lbl{font-size:.8rem; color:#7a5300; font-weight:700; display:block; margin-bottom:5px}
.otp-demo .code{
  font-size:2.1rem; font-weight:800; letter-spacing:.32em; color:var(--brand-900);
  font-variant-numeric:tabular-nums; text-indent:.32em; line-height:1.2;
}
.otp-demo .why{font-size:.76rem; color:#7a5300; margin:6px 0 0}
.otp-meta{display:flex; justify-content:space-between; align-items:center; gap:10px;
  font-size:.83rem; color:var(--ink-muted); margin-top:14px; flex-wrap:wrap}
.link-btn{
  background:none; border:0; font:inherit; font-size:.83rem; font-weight:700;
  color:var(--brand-700); cursor:pointer; padding:4px 2px; border-radius:6px; text-decoration:underline;
}
.link-btn:disabled{color:var(--ink-muted); cursor:not-allowed; text-decoration:none}
.link-btn:hover:not(:disabled){color:var(--brand-900)}
.alert-ok{background:#e8f8ec; color:#0a6b0a; border:1px solid #a8dcb4}
.alert-info{background:var(--brand-50); color:var(--brand-800); border:1px solid var(--brand-200)}

/* หน้าโปรไฟล์ */
.profile-head{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  background:linear-gradient(135deg,var(--brand-800),var(--brand-500));
  color:#fff; border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow-2);
}
.avatar{
  width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.2);
  border:2.5px solid rgba(255,255,255,.55); display:grid; place-items:center;
  font-size:1.6rem; font-weight:800; flex:0 0 auto;
}
.profile-head h1{margin:0; font-size:1.4rem; color:#fff}
.profile-head .meta{font-size:.9rem; color:#e5dcff; margin-top:2px}
.profile-head .right{margin-left:auto; text-align:right; font-size:.82rem; color:#e5dcff}
.locked-field{position:relative}
.locked-field input:disabled{background:var(--brand-50); color:var(--brand-800); font-weight:600}
.mini-list{list-style:none; margin:0; padding:0}
.mini-list li{
  display:flex; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); font-size:.9rem;
}
.mini-list li:first-child{border-top:0}
.mini-list .when{margin-left:auto; color:var(--ink-muted); font-size:.8rem; white-space:nowrap}

/* ============================================================
   19. ฟุตเตอร์ช่องทางติดต่อ · สถานะ/ความร้ายแรง · รูปภาพ · ให้คะแนน
   ============================================================ */

/* ---------- ฟุตเตอร์ ---------- */
.site-footer{padding:0}
.footer-grid{
  max-width:1240px; margin:0 auto; padding:28px 20px 20px;
  display:grid; gap:26px; grid-template-columns:1fr;
}
@media(min-width:820px){ .footer-grid{grid-template-columns:1.1fr 1.3fr .9fr; gap:34px} }
.f-brand{display:flex; align-items:center; gap:12px}
.f-brand img{height:52px; width:52px; border-radius:10px; background:#fff; object-fit:cover; flex:0 0 auto}
.f-brand strong{display:block; color:#fff; font-size:1rem; line-height:1.35}
.f-brand span{display:block; color:#cdbdf0; font-size:.84rem}
.f-col h4{
  color:var(--gold-300); font-size:.85rem; font-weight:800; margin:0 0 10px;
  letter-spacing:.02em; text-transform:none;
}
.f-contact{list-style:none; margin:0; padding:0; display:grid; gap:7px}
.f-contact li{display:flex; gap:9px; align-items:flex-start; line-height:1.5}
.f-contact .ic{flex:0 0 auto; width:18px; text-align:center; opacity:.9}
.f-contact a{color:#e6dcff; text-decoration:none; border-bottom:1px solid rgba(230,220,255,.35)}
.f-contact a:hover{color:#fff; border-bottom-color:#fff}
.f-credit p{margin:0 0 3px; line-height:1.55; color:#cdbdf0}
.footer-bottom{
  border-top:1px solid rgba(255,255,255,.14); padding:12px 20px;
  text-align:center; font-size:.79rem; color:#a892d8;
}

/* ---------- สถานะการดำเนินการ ---------- */
.status-pill{
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  font-size:.79rem; font-weight:800; padding:4px 12px; border-radius:999px; border:1.5px solid;
}
.st-wait{background:#fff8e5; color:#7a5300; border-color:#f0d79a}
.st-doing{background:#e7f0fc; color:#164b8f; border-color:#b3cef0}
.st-done{background:#e8f8ec; color:#0a6b0a; border-color:#a8dcb4}

/* ---------- ระดับความร้ายแรง ---------- */
.sev-badge{
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  font-size:.79rem; font-weight:800; padding:4px 12px; border-radius:999px; border:1.5px solid;
}
.sv-1{background:#eefaf1; color:#136c31; border-color:#b7e2c5}
.sv-2{background:#e8f8ec; color:#0a6b0a; border-color:#a8dcb4}
.sv-3{background:#fff8e5; color:#7a5300; border-color:#f0d79a}
.sv-4{background:#fdeee6; color:#8f3f16; border-color:#f3c4ab}
.sv-5{background:#fdecec; color:#8c1f1f; border-color:#f0b6b6}
.sev-dots{display:inline-flex; gap:3px; vertical-align:middle}
.sev-dots i{width:7px; height:7px; border-radius:2px; background:var(--line-strong); display:block}
.sev-dots i.on{background:currentColor}

/* ---------- อัปโหลดรูปภาพ ---------- */
.dropzone{
  border:2px dashed var(--brand-200); border-radius:var(--radius); background:var(--brand-50);
  padding:22px 18px; text-align:center; cursor:pointer; transition:.16s ease;
}
.dropzone:hover,.dropzone.over{background:var(--brand-100); border-color:var(--brand-500)}
.dropzone .dz-ico{font-size:1.9rem; display:block; margin-bottom:6px}
.dropzone .dz-main{font-weight:700; color:var(--brand-800); font-size:.95rem}
.dropzone .dz-sub{font-size:.8rem; color:var(--ink-muted); margin-top:3px}
.dropzone input[type=file]{display:none}
.thumbs{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px}
.thumb{
  position:relative; width:104px; height:104px; border-radius:var(--radius-sm); overflow:hidden;
  border:1.5px solid var(--line-strong); background:var(--surface-2); flex:0 0 auto;
}
.thumb img{width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in}
.thumb .rm{
  position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%;
  border:0; background:rgba(20,4,45,.72); color:#fff; cursor:pointer; font-size:.85rem;
  line-height:1; display:grid; place-items:center;
}
.thumb .rm:hover{background:var(--critical)}
.thumb .sz{
  position:absolute; left:0; right:0; bottom:0; background:rgba(20,4,45,.66); color:#fff;
  font-size:.68rem; text-align:center; padding:2px 0;
}
.thumb-sm{width:56px; height:56px; border-radius:8px}
.thumb-row{display:flex; gap:6px; flex-wrap:wrap}

/* ดูรูปเต็ม */
.lightbox{
  position:fixed; inset:0; z-index:300; background:rgba(12,3,26,.9);
  display:none; place-items:center; padding:24px;
}
.lightbox.show{display:grid}
.lightbox img{max-width:min(1100px,94vw); max-height:88vh; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lightbox .close{
  position:absolute; top:16px; right:20px; background:rgba(255,255,255,.16); color:#fff;
  border:0; font-size:1.5rem; width:44px; height:44px; border-radius:50%; cursor:pointer; line-height:1;
}
.lightbox .close:hover{background:rgba(255,255,255,.3)}

/* ---------- รูปโปรไฟล์ ---------- */
.avatar-edit{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.avatar-lg{
  width:104px; height:104px; border-radius:50%; overflow:hidden; flex:0 0 auto;
  background:var(--brand-100); border:3px solid var(--brand-200);
  display:grid; place-items:center; font-size:2.3rem; font-weight:800; color:var(--brand-700);
}
.avatar-lg img{width:100%; height:100%; object-fit:cover; display:block}
.avatar img{width:100%; height:100%; object-fit:cover; display:block; border-radius:50%}
.avatar{overflow:hidden; padding:0}
.avatar-actions{display:flex; flex-direction:column; gap:8px}
.avatar-actions .hint{font-size:.78rem; color:var(--ink-muted)}

/* ---------- ให้คะแนนเว็บไซต์ ---------- */
.rate-card{
  background:linear-gradient(135deg,var(--brand-50),#fff);
  border:1px solid var(--brand-200);
}
.stars{display:inline-flex; gap:4px; direction:rtl}
.stars input{position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%)}
.stars label{
  font-size:2rem; line-height:1; cursor:pointer; color:var(--line-strong);
  transition:transform .12s, color .12s; user-select:none;
}
.stars label::before{content:"★"}
.stars input:checked ~ label,
.stars label:hover, .stars label:hover ~ label{color:var(--gold-500)}
.stars label:hover{transform:scale(1.14)}
.stars input:focus-visible + label{outline:3px solid var(--brand-400); outline-offset:3px; border-radius:6px}
.stars-static{display:inline-flex; gap:2px; color:var(--gold-500); font-size:1.05rem; letter-spacing:.02em}
.stars-static .off{color:var(--line-strong)}
.rate-summary{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.rate-big{font-size:2.4rem; font-weight:800; color:var(--brand-900); line-height:1}
.rate-bars{flex:1 1 240px; min-width:200px}
.rate-bars .rb{display:flex; align-items:center; gap:9px; font-size:.8rem; margin-bottom:5px}
.rate-bars .rb .lab{width:30px; color:var(--ink-muted); text-align:right; white-space:nowrap}
.rate-bars .rb .track{flex:1; height:9px; background:var(--brand-100); border-radius:999px; overflow:hidden}
.rate-bars .rb .track > span{display:block; height:100%; background:var(--gold-500); border-radius:999px}
.rate-bars .rb .cnt{width:34px; text-align:right; color:var(--ink-2); font-variant-numeric:tabular-nums}

/* ---------- ไทม์ไลน์สถานะ ---------- */
.tl{list-style:none; margin:12px 0 0; padding:0 0 0 22px; position:relative}
.tl::before{content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--line)}
.tl li{position:relative; padding:0 0 14px}
.tl li:last-child{padding-bottom:0}
.tl li::before{
  content:""; position:absolute; left:-21px; top:5px; width:12px; height:12px; border-radius:50%;
  background:#fff; border:2.5px solid var(--line-strong);
}
.tl li.on::before{border-color:var(--brand-600); background:var(--brand-600)}
.tl li.cur::before{border-color:var(--brand-600); background:#fff; box-shadow:0 0 0 4px rgba(124,58,237,.18)}
.tl .t-name{font-weight:700; font-size:.92rem}
.tl .t-when{font-size:.79rem; color:var(--ink-muted)}

/* ---------- การ์ดรายการปัญหา (หน้าสถานะ) ---------- */
.case{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow-1); margin-bottom:14px;
}
.case-head{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:8px}
.case-head h3{margin:0; font-size:1.03rem; color:var(--brand-900); flex:1 1 220px}
.case-meta{font-size:.83rem; color:var(--ink-muted); display:flex; gap:10px; flex-wrap:wrap}
.case-body{display:grid; gap:16px; margin-top:12px}
@media(min-width:760px){ .case-body{grid-template-columns:1.2fr .8fr} }
.case .note{
  background:var(--surface-2); border-left:3px solid var(--brand-300);
  padding:9px 13px; border-radius:0 8px 8px 0; font-size:.87rem; color:var(--ink-2); margin-top:10px;
}

/* ---------- ตัวเลือกความร้ายแรงในฟอร์ม ---------- */
.sev-pick{display:grid; gap:8px; grid-template-columns:repeat(5,1fr)}
.sev-pick input{position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%)}
.sev-pick label{
  display:flex; flex-direction:column; align-items:center; gap:3px; text-align:center;
  padding:10px 5px; min-height:70px; cursor:pointer; justify-content:center;
  border:1.5px solid var(--line-strong); border-radius:var(--radius-sm);
  background:var(--surface-2); font-size:.76rem; color:var(--ink-2); line-height:1.25; transition:.15s;
}
.sev-pick label .num{font-size:1rem; font-weight:800}
.sev-pick label:hover{border-color:var(--brand-300); background:var(--brand-50)}
.sev-pick input:checked + label{border-width:2px; font-weight:700; box-shadow:var(--shadow-2)}
.sev-pick input:checked + label[data-s="1"]{background:#eefaf1; border-color:#3f9d5f; color:#0f5a28}
.sev-pick input:checked + label[data-s="2"]{background:#e8f8ec; border-color:#2f9440; color:#0a6b0a}
.sev-pick input:checked + label[data-s="3"]{background:#fff8e5; border-color:#d9a520; color:#7a5300}
.sev-pick input:checked + label[data-s="4"]{background:#fdeee6; border-color:#dd7a45; color:#8f3f16}
.sev-pick input:checked + label[data-s="5"]{background:#fdecec; border-color:#cf4a4a; color:#8c1f1f}
.sev-pick input:focus-visible + label{outline:3px solid var(--brand-400); outline-offset:2px}
@media(max-width:600px){
  .sev-pick{grid-template-columns:1fr}
  .sev-pick label{flex-direction:row; justify-content:flex-start; gap:10px; min-height:0; padding:9px 12px; font-size:.86rem}
}

/* ---------- แถบข้อมูลพื้นที่จัดเก็บ ---------- */
.storage-bar{height:10px; background:var(--brand-100); border-radius:999px; overflow:hidden; margin-top:8px}
.storage-bar > span{display:block; height:100%; background:linear-gradient(90deg,var(--brand-500),var(--brand-800))}
.storage-bar.warn > span{background:linear-gradient(90deg,var(--warn),var(--critical))}

@media print{
  .footer-grid,.footer-bottom,.dropzone,.lightbox{display:none !important}
  .thumb{width:70px; height:70px}
}

/* รูปโปรไฟล์เล็กบนแถบเมนู */
.nav-ava{
  width:22px; height:22px; border-radius:50%; object-fit:cover; vertical-align:-6px;
  margin-right:5px; border:1.5px solid rgba(255,255,255,.6); background:#fff;
}
img[data-missing]{background:var(--brand-100); border:1px dashed var(--line-strong)}

/* ---------- กำลังเชื่อมต่อฐานข้อมูล ---------- */
.sp-loading{
  position:fixed; inset:0; z-index:500; display:grid; place-items:center; gap:14px;
  grid-auto-flow:row; background:rgba(255,255,255,.92); backdrop-filter:blur(3px);
  color:var(--brand-800); font-weight:700; font-size:.95rem;
}
.sp-spin{
  width:42px; height:42px; border-radius:50%;
  border:4px solid var(--brand-100); border-top-color:var(--brand-600);
  animation:spspin .8s linear infinite;
}
@keyframes spspin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){ .sp-spin{animation-duration:2.4s} }

/* ป้ายบอกโหมดการทำงาน */
.mode-chip{
  display:inline-flex; align-items:center; gap:6px; font-size:.72rem; font-weight:700;
  padding:2px 9px; border-radius:999px; white-space:nowrap;
}
.mode-online{background:#e8f8ec; color:#0a6b0a; border:1px solid #a8dcb4}
.mode-local{background:#fff8e5; color:#7a5300; border:1px solid #f0d79a}

/* ---------- หน้ารอยืนยันอีเมล ---------- */
.mail-wait{text-align:center; padding:10px 0}
.mail-wait .mail-ico{font-size:3rem; line-height:1; margin-bottom:12px}
.mail-wait p{margin:0 0 8px; line-height:1.65}


/* ---------- โครงสำหรับไฟล์เดียว (single page) ---------- */
#view{flex:1 0 auto; display:flex; flex-direction:column; min-width:0}
#view > main{flex:1 0 auto}
#view > .masthead{flex:0 0 auto}

</style>

<header id="topbar" class="topbar" data-nav="student" data-active=""></header>
<div id="view"></div>
<footer id="siteFooter" class="site-footer"></footer>

<template id="tpl-intex7">
<main>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <img data-img="school" alt="ตราโรงเรียนร้องกวางอนุสรณ์">
      <img data-img="council" alt="ตราสภานักเรียน">
      <h1>เข้าสู่ระบบนักเรียน</h1>
      <p>สภานักเรียนโรงเรียนร้องกวางอนุสรณ์ · ปีการศึกษา 2569
        <span class="mode-chip" id="modeChip"></span></p>
    </div>

    <div class="alert alert-info" id="needBox"></div>
    <div class="alert alert-ok" id="okBox"></div>
    <div class="alert alert-err" id="errBox"></div>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabLogin" aria-selected="true" aria-controls="panelLogin">เข้าสู่ระบบ</button>
      <button type="button" role="tab" id="tabReg" aria-selected="false" aria-controls="panelReg">ลงทะเบียนใหม่</button>
    </div>

    <!-- ===== เข้าสู่ระบบ ===== -->
    <section class="tab-panel" id="panelLogin" role="tabpanel" aria-labelledby="tabLogin">
      <form id="loginForm" novalidate>
        <div class="form-grid">
          <div class="field only-local">
            <label for="l-sid">รหัสนักเรียน <span class="req">*</span></label>
            <input type="text" id="l-sid" inputmode="numeric" placeholder="เช่น 20000">
            <span class="err-msg">กรุณากรอกรหัสนักเรียน</span>
          </div>
          <div class="field">
            <label for="l-email">อีเมล <span class="req">*</span></label>
            <input type="email" id="l-email" autocomplete="email" placeholder="เช่น student@gmail.com" required>
            <span class="err-msg">กรุณากรอกอีเมลให้ถูกต้อง</span>
          </div>
          <div class="field only-online">
            <label for="l-pass">รหัสผ่าน <span class="req">*</span></label>
            <div class="pw-wrap">
              <input type="password" id="l-pass" autocomplete="current-password" placeholder="รหัสผ่านของคุณ">
              <button type="button" class="pw-toggle" data-pw="l-pass" aria-label="แสดง/ซ่อนรหัสผ่าน">แสดง</button>
            </div>
            <span class="err-msg">กรุณากรอกรหัสผ่าน</span>
          </div>
        </div>
        <div class="btn-row" style="justify-content:center">
          <button type="submit" class="btn btn-primary" id="loginBtn">เข้าสู่ระบบ</button>
        </div>
        <p class="text-muted" style="font-size:.83rem;text-align:center;margin:14px 0 0">
          <span class="only-online"><button type="button" class="link-btn" id="forgotBtn">ลืมรหัสผ่าน?</button> · </span>
          ยังไม่เคยลงทะเบียน? <button type="button" class="link-btn" id="goReg">ลงทะเบียนที่นี่</button>
        </p>
      </form>
    </section>

    <!-- ===== ลงทะเบียน ===== -->
    <section class="tab-panel" id="panelReg" role="tabpanel" aria-labelledby="tabReg" hidden>
      <form id="regForm" novalidate>
        <div class="form-grid cols-2">
          <div class="field span-2">
            <label for="r-name">ชื่อ - นามสกุล <span class="req">*</span></label>
            <input type="text" id="r-name" placeholder="เช่น เด็กหญิงกวางน้อย ใจดี" required>
            <span class="err-msg">กรุณากรอกชื่อ - นามสกุล</span>

          <div class="field">
            <label for="r-sid">รหัสนักเรียน <span class="req">*</span></label>

            <span class="err-msg">กรุณาเลือกชั้น</span>
          </div>
          <div class="field">
            <label for="r-no">เลขที่ <span class="req">*</span></label>

            <span class="err-msg">กรุณากรอกเลขที่ (1-60)</span>
          </div>
          <div class="field">
            <label for="r-email">อีเมล <span class="req">*</span></label>
            <input type="email" id="r-email" placeholder="เช่น student@gmail.com" required>
            <span class="err-msg" id="emailErr">กรุณากรอกอีเมลให้ถูกต้อง</span>
          </div>
          <div class="field only-online">
            <label for="r-pass">ตั้งรหัสผ่าน <span class="req">*</span></label>
            <div class="pw-wrap">
              <input type="password" id="r-pass" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร">
              <button type="button" class="pw-toggle" data-pw="r-pass" aria-label="แสดง/ซ่อนรหัสผ่าน">แสดง</button>
            </div>
            <span class="err-msg" id="passErr">รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร</span>
          </div>
          <div class="field only-online">
            <label for="r-pass2">ยืนยันรหัสผ่าน <span class="req">*</span></label>
            <input type="password" id="r-pass2" autocomplete="new-password" placeholder="พิมพ์รหัสผ่านอีกครั้ง">
            <span class="err-msg">รหัสผ่านทั้งสองช่องไม่ตรงกัน</span>
          </div>
        </div>
        <div class="callout" style="margin-top:16px;font-size:.84rem">
          ข้อมูลนี้ใช้เพื่อยืนยันตัวตนนักเรียนและติดตามการมีส่วนร่วมเท่านั้น จะไม่ถูกเปิดเผยต่อสาธารณะ<br>
          <span id="rosterNote"></span>
        </div>
        <div class="btn-row" style="justify-content:center">

<script type="text/plain" id="schemaSql">-- ============================================================
--  เว็บไซต์สภานักเรียนโรงเรียนร้องกวางอนุสรณ์
--  โครงสร้างฐานข้อมูล Supabase (PostgreSQL) + Row Level Security
--  ------------------------------------------------------------
--  วิธีใช้: เปิด Supabase Dashboard > SQL Editor > New query
--           วางไฟล์นี้ทั้งหมด แล้วกด Run (รันซ้ำได้ ไม่พัง)
-- ============================================================

-- ---------- 1. ตาราง ----------

-- แอดมิน: เพิ่ม uid ของผู้ใช้ที่จะเป็นแอดมินลงตารางนี้เอง (ดูวิธีใน README)
create table if not exists public.admins (
  id          uuid primary key references auth.users(id) on delete cascade,
  name        text,
  created_at  timestamptz not null default now()
);

-- คลังรายชื่อนักเรียนทั้งโรงเรียน (แอดมินนำเข้า ใช้ตรวจตอนลงทะเบียน)
create table if not exists public.roster (
  sid         text primary key,
  name        text not null,
  room        text not null,
  number      text not null,
  created_at  timestamptz not null default now()
);

-- บัญชีนักเรียนที่ลงทะเบียนเข้าใช้เว็บไซต์แล้ว
create table if not exists public.students (
  id          text primary key default gen_random_uuid()::text,
  auth_id     uuid unique references auth.users(id) on delete cascade,
  sid         text not null unique,
  name        text not null,
  room        text not null,
  number      text not null,
  email       text not null,
  photo       text,
  created_at  timestamptz not null default now(),
  updated_at  timestamptz not null default now()
);
create index if not exists students_auth_idx on public.students(auth_id);

-- โหวตกิจกรรม (1 คน 1 เสียง)
create table if not exists public.votes (
  id          text primary key default gen_random_uuid()::text,
  sid         text not null unique,
  name        text not null,
  room        text not null,
  number      text not null,
  activity    text not null,
  like_level  smallint not null check (like_level between 1 and 5),
  suggest     text default '',
  created_at  timestamptz not null default now()
);

-- ผลแบบประเมินสภาพจิตใจ (ข้อมูลอ่อนไหว: นักเรียนเห็นเฉพาะของตัวเอง)
create table if not exists public.mental_results (
  id          text primary key default gen_random_uuid()::text,
  sid         text not null,
  name        text not null,
  room        text not null,
  number      text not null,
  answers     jsonb not null default '[]'::jsonb,
  score       smallint,
  level       smallint not null check (level between 1 and 5),
  created_at  timestamptz not null default now()
);
create index if not exists mental_sid_idx on public.mental_results(sid);

-- ปัญหาภายในโรงเรียน
create table if not exists public.problems (
  id          text primary key default gen_random_uuid()::text,
  sid         text,
  name        text,
  room        text,
  number      text,
  reported_by text default '',
  problem     text not null,
  place       text not null,
  severity    smallint not null default 3 check (severity between 1 and 5),
  detail      text default '',
  photos      text[] not null default '{}',
  status      text not null default 'wait' check (status in ('wait','doing','done')),
  history     jsonb not null default '[]'::jsonb,
  created_at  timestamptz not null default now(),
  updated_at  timestamptz not null default now()
);
create index if not exists problems_sid_idx on public.problems(sid);
create index if not exists problems_status_idx on public.problems(status);

-- งบประมาณ
create table if not exists public.budget (
  id          text primary key default gen_random_uuid()::text,
  item        text not null,
  total       numeric(12,2) not null default 0,
  actual      numeric(12,2) not null default 0,
  recorder    text not null,
  note        text default '',
  created_at  timestamptz not null default now()
);

-- คะแนนโหวตที่แอดมินเพิ่มเอง (จากการโหวตนอกระบบ)
create table if not exists public.vote_extra (
  id          text primary key default gen_random_uuid()::text,
  activity    text not null,
  count       integer not null default 0,
  created_at  timestamptz not null default now()
);

-- คะแนนความพึงพอใจเว็บไซต์ (1 คน 1 ครั้ง)
create table if not exists public.ratings (
  sid         text primary key,
  name        text,
  room        text,
  stars       smallint not null check (stars between 1 and 5),
  comment     text default '',
  created_at  timestamptz not null default now()
);

-- ค่าตั้งค่าของระบบ (เช่น เปิด/ปิดการตรวจสอบกับคลังรายชื่อ)
create table if not exists public.app_settings (
  key         text primary key,
  value       jsonb not null default '{}'::jsonb,
  updated_at  timestamptz not null default now()
);
insert into public.app_settings(key, value)
values ('settings', '{"strictRoster": true}'::jsonb)
on conflict (key) do nothing;


-- ---------- 2. ฟังก์ชันช่วยตรวจสิทธิ์ ----------

-- เป็นแอดมินหรือไม่ (security definer เพื่อไม่ให้ RLS วนซ้ำ)
create or replace function public.is_admin()
returns boolean
language sql stable security definer set search_path = public
as $$
  select exists (select 1 from public.admins a where a.id = auth.uid());
$$;

-- รหัสนักเรียนของคนที่ล็อกอินอยู่
create or replace function public.my_sid()
returns text
language sql stable security definer set search_path = public
as $$
  select s.sid from public.students s where s.auth_id = auth.uid() limit 1;
$$;

-- ต้องตรวจกับคลังรายชื่อไหม (ถ้าคลังว่างให้ผ่านเสมอ)
create or replace function public.roster_check_on()
returns boolean
language sql stable security definer set search_path = public
as $$
  select coalesce((select (value->>'strictRoster')::boolean from public.app_settings where key='settings'), true)
         and exists (select 1 from public.roster limit 1);
$$;

-- ข้อมูลที่กรอกตรงกับคลังรายชื่อไหม
create or replace function public.matches_roster(p_sid text, p_name text, p_room text, p_number text)
returns boolean
language sql stable security definer set search_path = public
as $$
  select case
    when not public.roster_check_on() then true
    else exists (
      select 1 from public.roster r
      where r.sid = p_sid
        and btrim(r.name)   = btrim(p_name)
        and btrim(r.room)   = btrim(p_room)
        and btrim(r.number) = btrim(p_number)
    )
  end;
$$;


-- ---------- 3. เปิด Row Level Security ----------

alter table public.admins          enable row level security;
alter table public.roster          enable row level security;
alter table public.students        enable row level security;
alter table public.votes           enable row level security;
alter table public.mental_results  enable row level security;
alter table public.problems        enable row level security;
alter table public.budget          enable row level security;
alter table public.vote_extra      enable row level security;
alter table public.ratings         enable row level security;
alter table public.app_settings    enable row level security;

-- ล้าง policy เดิมก่อน (ให้รันไฟล์นี้ซ้ำได้)
do $$
declare r record;
begin
  for r in
    select schemaname, tablename, policyname from pg_policies
    where schemaname = 'public'
      and tablename in ('admins','roster','students','votes','mental_results',
                        'problems','budget','vote_extra','ratings','app_settings')
  loop
    execute format('drop policy %I on %I.%I', r.policyname, r.schemaname, r.tablename);
  end loop;
end $$;


-- ---------- 4. Policy ----------

-- admins: อ่านได้เพื่อเช็คตัวเอง / เพิ่มลบผ่าน Dashboard เท่านั้น
create policy admins_select on public.admins
  for select to authenticated using (true);

-- roster: ทุกคนที่ล็อกอินอ่านได้ / แอดมินเท่านั้นที่แก้ได้
create policy roster_select on public.roster
  for select to authenticated using (true);
create policy roster_write on public.roster
  for all to authenticated using (public.is_admin()) with check (public.is_admin());

-- students: เห็นของตัวเอง หรือแอดมินเห็นทั้งหมด
create policy students_select on public.students
  for select to authenticated
  using (auth_id = auth.uid() or public.is_admin());

-- สมัครได้เฉพาะบัญชีตัวเอง อีเมลต้องตรงกับที่ล็อกอิน และต้องตรงกับคลังรายชื่อ
create policy students_insert_self on public.students
  for insert to authenticated
  with check (
    auth_id = auth.uid()
    and lower(email) = lower(coalesce(auth.jwt() ->> 'email', ''))
    and public.matches_roster(sid, name, room, number)
  );
create policy students_insert_admin on public.students
  for insert to authenticated with check (public.is_admin());

create policy students_update on public.students
  for update to authenticated
  using (auth_id = auth.uid() or public.is_admin())
  with check (auth_id = auth.uid() or public.is_admin());
create policy students_delete on public.students
  for delete to authenticated using (public.is_admin());

-- votes: ผลโหวตเป็นข้อมูลส่วนรวม ทุกคนอ่านได้ / แก้ได้เฉพาะของตัวเอง
create policy votes_select on public.votes
  for select to authenticated using (true);
create policy votes_insert on public.votes
  for insert to authenticated with check (sid = public.my_sid() or public.is_admin());
create policy votes_update on public.votes
  for update to authenticated
  using (sid = public.my_sid() or public.is_admin())
  with check (sid = public.my_sid() or public.is_admin());
create policy votes_delete on public.votes
  for delete to authenticated using (sid = public.my_sid() or public.is_admin());

-- mental_results: ข้อมูลอ่อนไหว นักเรียนเห็นเฉพาะของตัวเอง
create policy mental_select on public.mental_results
  for select to authenticated using (sid = public.my_sid() or public.is_admin());
create policy mental_insert on public.mental_results
  for insert to authenticated with check (sid = public.my_sid() or public.is_admin());
create policy mental_delete on public.mental_results
  for delete to authenticated using (public.is_admin());

-- problems: นักเรียนเห็นเฉพาะเรื่องที่ตัวเองแจ้ง / แอดมินเห็นและแก้สถานะได้ทั้งหมด
create policy problems_select on public.problems
  for select to authenticated using (sid = public.my_sid() or public.is_admin());
create policy problems_insert on public.problems
  for insert to authenticated with check (sid = public.my_sid() or public.is_admin());
create policy problems_update on public.problems
  for update to authenticated using (public.is_admin()) with check (public.is_admin());
create policy problems_delete on public.problems
  for delete to authenticated using (public.is_admin());

-- budget / vote_extra: ทุกคนอ่านได้ แอดมินเท่านั้นที่แก้
create policy budget_select on public.budget
  for select to authenticated using (true);
create policy budget_write on public.budget
  for all to authenticated using (public.is_admin()) with check (public.is_admin());

create policy vote_extra_select on public.vote_extra
  for select to authenticated using (true);
create policy vote_extra_write on public.vote_extra
  for all to authenticated using (public.is_admin()) with check (public.is_admin());

-- ratings: ทุกคนอ่านได้ (ไว้คำนวณค่าเฉลี่ย) แก้ได้เฉพาะของตัวเอง
create policy ratings_select on public.ratings
  for select to authenticated using (true);
create policy ratings_write on public.ratings
  for all to authenticated
  using (sid = public.my_sid() or public.is_admin())
  with check (sid = public.my_sid() or public.is_admin());

-- app_settings: ทุกคนอ่านได้ แอดมินเท่านั้นที่แก้
create policy settings_select on public.app_settings
  for select to authenticated using (true);
create policy settings_write on public.app_settings
  for all to authenticated using (public.is_admin()) with check (public.is_admin());


-- ---------- 5. เปิด Realtime ----------
do $$
begin
  if not exists (select 1 from pg_publication where pubname = 'supabase_realtime') then
    create publication supabase_realtime;
  end if;
end $$;

alter publication supabase_realtime add table public.roster;
alter publication supabase_realtime add table public.students;
alter publication supabase_realtime add table public.votes;
alter publication supabase_realtime add table public.mental_results;
alter publication supabase_realtime add table public.problems;
alter publication supabase_realtime add table public.budget;
alter publication supabase_realtime add table public.vote_extra;
alter publication supabase_realtime add table public.ratings;
alter publication supabase_realtime add table public.app_settings;


-- ---------- 6. ที่เก็บรูปภาพ ----------
insert into storage.buckets (id, name, public)
values ('photos', 'photos', false)
on conflict (id) do nothing;

drop policy if exists photos_read   on storage.objects;
drop policy if exists photos_insert on storage.objects;
drop policy if exists photos_delete on storage.objects;

-- อ่านรูปได้ทุกคนที่ล็อกอิน (ใช้ signed URL อายุสั้น)
create policy photos_read on storage.objects
  for select to authenticated using (bucket_id = 'photos');
create policy photos_insert on storage.objects
  for insert to authenticated with check (bucket_id = 'photos');
create policy photos_delete on storage.objects
  for delete to authenticated using (bucket_id = 'photos');
</script>

<script>
/* ============================================================
   2. ตั้งค่า Supabase — แก้ตรงนี้ที่เดียว
   ============================================================ */
/* ============================================================
   config.js — ตั้งค่าเชื่อมต่อ Supabase
   ------------------------------------------------------------
   ปล่อยว่างไว้ = เว็บทำงาน "โหมดเครื่องเดียว" (เก็บข้อมูลในเบราว์เซอร์)
   ใส่ค่าครบ   = เว็บทำงาน "โหมดออนไลน์" ทุกเครื่องเห็นข้อมูลเดียวกัน

   เอาค่ามาจากไหน
     Supabase Dashboard > โปรเจกต์ของคุณ > Project Settings > API
       • Project URL      -> ใส่ที่ url
       • anon public key  -> ใส่ที่ anonKey

   คีย์ anon เปิดเผยได้ ไม่ใช่ความลับ — ความปลอดภัยมาจาก Row Level Security
   ที่ตั้งไว้ในไฟล์ supabase/schema.sql
   (ห้ามเอา service_role key มาใส่ตรงนี้เด็ดขาด)
   ============================================================ */

window.SUPABASE_CONFIG = {
  url: '',
  anonKey: ''
};

/* เวอร์ชัน supabase-js ที่ใช้ (อัปเดตได้ที่นี่) */
window.SUPABASE_SDK = 'https://esm.sh/@supabase/supabase-js@2.49.9';

/* ตั้งเป็น true ถ้าเปิด "Confirm email" ใน Supabase (ต้องตั้ง custom SMTP ก่อน)
   ถ้าเป็น false นักเรียนสมัครแล้วเข้าใช้งานได้ทันที */
window.REQUIRE_EMAIL_CONFIRM = false;

</script>

<script>
/* ============================================================
   3. ตัวเชื่อม Supabase
   ============================================================ */
/* ============================================================
   db.js — ตัวเชื่อม Supabase (ฐานข้อมูล + ล็อกอิน + รูปภาพ)
   ------------------------------------------------------------
   แนวคิด: ดึงข้อมูลจาก Supabase มาเก็บไว้ใน "แคชในหน่วยความจำ"
   แล้วให้โค้ดเดิมที่เรียกแบบทันที (SP.list / SP.read) อ่านจากแคชนั้น
   เมื่อมีใครแก้ข้อมูล Realtime จะแจ้งมา ระบบดึงใหม่แล้ววาดหน้าใหม่ให้เอง

   ถ้ายังไม่ได้ใส่ค่าใน config.js ไฟล์นี้จะปิดตัวเองเงียบ ๆ
   แล้วเว็บกลับไปทำงานโหมดเครื่องเดียวเหมือนเดิมทุกอย่าง
   ============================================================ */
(function (global) {
  'use strict';

  var CFG = global.SUPABASE_CONFIG || {};
  var SDK = global.SUPABASE_SDK || 'https://esm.sh/@supabase/supabase-js@2.49.9';
  var ENABLED = !!(CFG.url && CFG.anonKey);
  var BUCKET = 'photos';

  var sb = null;
  var cache = {};        /* ข้อมูลที่หน้าเว็บอ่าน (แก้ไขได้) */
  var mirror = {};       /* สำเนาตรงกับเซิร์ฟเวอร์ ใช้เทียบว่ามีอะไรเปลี่ยน */
  var listeners = [];
  var signedUrls = {};     /* ref -> {url, exp} */
  var channel = null;
  var pending = {};
  var inflight = Promise.resolve();     /* คิวงานเขียนที่ยังไม่เสร็จ */

  /* รอให้การบันทึกที่ค้างอยู่เสร็จก่อน (ใช้ก่อนเปลี่ยนหน้า) */
  function flush() { return inflight['catch'](function () { }); }
  function track(pr) {
    inflight = inflight['catch'](function () { }).then(function () { return pr; });
    return inflight;
  }

  var state = {
    enabled: ENABLED, online: false, ready: false,
    user: null, email: null, sid: null, isAdmin: false,
    error: null
  };

  function clone(v) { try { return JSON.parse(JSON.stringify(v)); } catch (e) { return v; } }
  function log(m) { try { console.info('[Supabase] ' + m); } catch (e) { } }
  function fire() { listeners.forEach(function (f) { try { f(); } catch (e) { console.error(e); } }); }
  function onSync(fn) { if (typeof fn === 'function') listeners.push(fn); }

  /* ---------- วันเวลาไทย ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function thDate(iso) {
    var d = iso ? new Date(iso) : new Date();
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + (d.getFullYear() + 543);
  }
  function thTime(iso) {
    var d = iso ? new Date(iso) : new Date();
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' น.';
  }
  function low(v) { return String(v == null ? '' : v).toLowerCase(); }
  function str(v) { return v == null ? '' : String(v); }
  function num(v) { return Number(v) || 0; }

  /* ---------- ผังการแปลงข้อมูล JS <-> ตารางฐานข้อมูล ---------- */
  var SPEC = {
    roster: {
      table: 'roster', key: 'sid',
      from: function (w) { return { sid: w.sid, name: w.name, room: w.room, no: str(w.number) }; },
      to: function (r) { return { sid: str(r.sid), name: r.name, room: r.room, number: str(r.no) }; }
    },
    students: {
      table: 'students', key: 'sid',
      from: function (w) {
        return {
          sid: w.sid, name: w.name, room: w.room, no: str(w.number), email: w.email,
          photo: w.photo || undefined, verified: true, authId: w.auth_id || undefined,
          rowId: w.id, createdAt: w.created_at, updatedAt: w.updated_at,
          createdDate: thDate(w.created_at), createdTime: thTime(w.created_at)
        };
      },
      to: function (r) {
        var o = {
          sid: str(r.sid), name: r.name, room: r.room, number: str(r.no),
          email: low(r.email), photo: r.photo || null,
          updated_at: new Date().toISOString()
        };
        if (r.rowId) o.id = r.rowId;
        if (r.authId) o.auth_id = r.authId;
        return o;
      }
    },
    votes: {
      table: 'votes', key: 'sid',
      from: function (w) {
        return {
          id: w.id, sid: w.sid, name: w.name, room: w.room, no: str(w.number),
          activity: w.activity, like: w.like_level, suggest: w.suggest || '',
          iso: w.created_at, date: thDate(w.created_at), time: thTime(w.created_at)
        };
      },
      to: function (r) {
        return {
          id: r.id, sid: str(r.sid), name: r.name, room: r.room, number: str(r.no),
          activity: r.activity, like_level: num(r.like), suggest: r.suggest || ''
        };
      }
    },
    mental: {
      table: 'mental_results', key: 'id',
      from: function (w) {
        return {
          id: w.id, sid: w.sid, name: w.name, room: w.room, no: str(w.number),
          answers: w.answers || [], score: w.score, level: w.level,
          levelName: '', iso: w.created_at, date: thDate(w.created_at), time: thTime(w.created_at)

    budget: {

      },

    },

      }

  };
  var SETTINGS = 'settings';

  function handles(key) { return !!SPEC[key] || key === SETTINGS; }

  /* ---------- โหลด SDK ---------- */
  function loadSdk() {
    return import(SDK).then(function (m) {
      sb = m.createClient(CFG.url, CFG.anonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
    });
  }

  /* ---------- ดึงข้อมูล ---------- */
  function fetchOne(key) {
    var spec = SPEC[key];
    if (!spec) return Promise.resolve();
    return sb.from(spec.table).select('*').then(function (res) {
      if (res.error) {
        log('ดึง ' + spec.table + ' ไม่สำเร็จ: ' + res.error.message);
        if (cache[key] === undefined) { cache[key] = []; mirror[key] = []; }
        return;
      }
      cache[key] = (res.data || []).map(spec.from);
      mirror[key] = clone(cache[key]);
    });
  }
  function fetchSettings() {
    return sb.from('app_settings').select('value').eq('key', 'settings').maybeSingle()
      .then(function (res) {
        cache[SETTINGS] = res && res.data ? res.data.value : null;
        mirror[SETTINGS] = clone(cache[SETTINGS]);
      })['catch'](function () { cache[SETTINGS] = null; mirror[SETTINGS] = null; });
  }
  function fetchAll() {
    var jobs = Object.keys(SPEC).map(fetchOne);
    jobs.push(fetchSettings());
    return Promise.all(jobs);
  }

  /* ดึงเฉพาะตารางที่เปลี่ยน (รวบหลายเหตุการณ์ที่มาติด ๆ กัน) */
  function refetch(key) {
    if (pending[key]) return;
    pending[key] = setTimeout(function () {
      delete pending[key];
      (key === SETTINGS ? fetchSettings() : fetchOne(key)).then(fire);
    }, 220);
  }

  /* ---------- อ่าน / เขียน ---------- */
  function get(key, fallback) {
    var v = cache[key];
    return v === undefined ? fallback : v;
  }

  function indexBy(arr, k) {
    var m = {};
    (arr || []).forEach(function (r) { var i = r && r[k]; if (i != null) m[String(i)] = r; });
    return m;
  }
  function same(a, b) {
    try { return JSON.stringify(a) === JSON.stringify(b); } catch (e) { return false; }
  }
  function report(err) {
    var msg = (err && (err.message || err.error_description)) || 'ไม่ทราบสาเหตุ';
    state.error = msg;
    log('บันทึกไม่สำเร็จ: ' + msg);
    if (global.SP && global.SP.toast) {
      global.SP.toast(/policy|permission|row-level/i.test(msg)
        ? 'ไม่มีสิทธิ์บันทึกข้อมูลนี้'
        : 'บันทึกขึ้นเซิร์ฟเวอร์ไม่สำเร็จ');
    }
  }

  function put(key, value) {
    if (key === SETTINGS) {
      cache[key] = value; mirror[key] = clone(value); fire();
      track(sb.from('app_settings')
        .upsert({ key: 'settings', value: value || {}, updated_at: new Date().toISOString() },
                { onConflict: 'key' })
        .then(function (r) { if (r.error) report(r.error); }));
      return true;
    }
    var spec = SPEC[key];
    if (!spec) return false;

    /* เทียบกับสำเนาต้นฉบับ ไม่ใช่ตัวแคชที่หน้าเว็บอาจแก้ไปแล้ว */
    var before = indexBy(mirror[key] || [], spec.key);
    var after = indexBy(value || [], spec.key);
    cache[key] = (value || []).slice();
    mirror[key] = clone(cache[key]);
    fire();

    var dels = Object.keys(before).filter(function (k) { return !after[k]; });
    var ups = Object.keys(after)
      .filter(function (k) { return !before[k] || !same(before[k], after[k]); })
      .map(function (k) { return spec.to(after[k]); });

    var chain = Promise.resolve();
    if (dels.length) {
      chain = chain.then(function () {
        return sb.from(spec.table)['delete']().in(spec.key, dels);
      }).then(function (r) { if (r && r.error) report(r.error); });
    }
    if (ups.length) {
      chain = chain.then(function () {
        return sb.from(spec.table).upsert(ups, { onConflict: spec.key });
      }).then(function (r) { if (r && r.error) report(r.error); });
    }
    track(chain['catch'](report));
    return true;
  }

  /* ---------- รูปภาพ (Supabase Storage) ---------- */
  var PREFIX = 'sb:';
  function isPhotoRef(ref) { return String(ref || '').indexOf(PREFIX) === 0; }
  function pathOf(ref) { return String(ref).slice(PREFIX.length); }

  function putPhoto(blob) {
    var who = state.sid || (state.user && state.user.id) || 'anon';
    var path = who + '/' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + '.jpg';
    return sb.storage.from(BUCKET).upload(path, blob, {
      contentType: blob.type || 'image/jpeg', upsert: false
    }).then(function (r) {
      if (r.error) throw new Error(r.error.message);
      return PREFIX + path;
    });
  }
  function getPhoto(ref) {
    if (!ref) return Promise.resolve('');
    var c = signedUrls[ref];
    if (c && c.exp > Date.now()) return Promise.resolve(c.url);
    return sb.storage.from(BUCKET).createSignedUrl(pathOf(ref), 3600).then(function (r) {
      if (r.error || !r.data) return '';
      signedUrls[ref] = { url: r.data.signedUrl, exp: Date.now() + 50 * 60 * 1000 };
      return r.data.signedUrl;
    })['catch'](function () { return ''; });
  }
  function delPhoto(ref) {
    delete signedUrls[ref];
    return sb.storage.from(BUCKET).remove([pathOf(ref)])
      .then(function () { return true; })['catch'](function () { return false; });
  }

  /* ---------- ล็อกอิน ---------- */
  function signUp(email, password) {
    return sb.auth.signUp({ email: low(email), password: password }).then(function (r) {
      if (r.error) throw r.error;
      return r.data;
    });
  }
  function signIn(email, password) {
    return sb.auth.signInWithPassword({ email: low(email), password: password }).then(function (r) {
      if (r.error) throw r.error;
      return r.data;
    });
  }
  function signOutNow() { return sb.auth.signOut(); }
  function resendConfirm(email) {
    return sb.auth.resend({ type: 'signup', email: low(email) });
  }
  function resetPassword(email) {
    return sb.auth.resetPasswordForEmail(low(email), {
      redirectTo: location.origin + '/intex7.html?reset=1'
    });
  }

  /* เพิ่มแถวนักเรียนของตัวเอง (RLS จะตรวจกับคลังรายชื่อให้อีกชั้น) */
  function createMyStudent(rec) {
    return sb.from('students').insert({
      auth_id: state.user.id,
      sid: str(rec.sid), name: rec.name, room: rec.room,
      number: str(rec.no), email: low(rec.email)
    }).then(function (r) {
      if (r.error) throw r.error;
      return true;
    });
  }

  /* อ่านคลังรายชื่อทีละคน (ใช้ตอนสมัคร ก่อนมีสิทธิ์เห็นทั้งตาราง) */
  function rosterOnce(sid) {
    return sb.from('roster').select('*').eq('sid', str(sid)).maybeSingle()
      .then(function (r) { return r && r.data ? SPEC.roster.from(r.data) : null; })
      ['catch'](function () { return null; });
  }

  function refreshRole() {
    var u = state.user;
    if (!u) { state.isAdmin = false; state.sid = null; return Promise.resolve(state); }
    return Promise.all([
      sb.from('admins').select('id').eq('id', u.id).maybeSingle(),
      sb.from('students').select('sid').eq('auth_id', u.id).maybeSingle()
    ]).then(function (res) {
      state.isAdmin = !!(res[0] && res[0].data);
      state.sid = res[1] && res[1].data ? String(res[1].data.sid) : null;
      return state;
    })['catch'](function () { return state; });
  }

  /* ---------- Realtime ---------- */
  function subscribe() {
    if (channel) { try { sb.removeChannel(channel); } catch (e) { } channel = null; }
    channel = sb.channel('sapara-live');
    Object.keys(SPEC).forEach(function (key) {
      channel.on('postgres_changes',
        { event: '*', schema: 'public', table: SPEC[key].table },
        function () { refetch(key); });
    });
    channel.on('postgres_changes',
      { event: '*', schema: 'public', table: 'app_settings' },
      function () { refetch(SETTINGS); });
    channel.subscribe();
  }

  /* ---------- เริ่มระบบ ---------- */
  var startPromise = null;
  function start() {
    if (!ENABLED) return Promise.resolve(state);
    if (startPromise) return startPromise;

    startPromise = loadSdk().then(function () {
      state.online = true;
      log('เชื่อมต่อ ' + CFG.url + ' แล้ว');

      sb.auth.onAuthStateChange(function (evt, session) {
        var uid = session && session.user ? session.user.id : null;
        var had = state.user ? state.user.id : null;
        state.user = session ? session.user : null;
        state.email = state.user ? low(state.user.email) : null;
        if (uid === had) return;
        if (!uid) { cache = {}; mirror = {}; state.isAdmin = false; state.sid = null; fire(); return; }
        refreshRole().then(fetchAll).then(function () { subscribe(); fire(); });
      });

      return sb.auth.getSession().then(function (r) {
        var session = r && r.data ? r.data.session : null;
        state.user = session ? session.user : null;
        state.email = state.user ? low(state.user.email) : null;
        if (!state.user) { state.ready = true; return state; }
        return refreshRole().then(fetchAll).then(function () {
          subscribe();
          state.ready = true;
          return state;
        });
      });
    })['catch'](function (err) {
      state.online = false;
      state.error = err.message;
      log('เริ่มระบบไม่สำเร็จ: ' + err.message + ' — กลับไปโหมดเครื่องเดียว');
      return state;
    });

    return startPromise;
  }

  /* ---------- ส่งออก ---------- */
  global.SPDB = {
    enabled: ENABLED,
    state: state,
    SETTINGS_KEY: SETTINGS,
    start: start,
    on: function () { return ENABLED && state.online && !!state.user; },
    live: function () { return ENABLED && state.online; },
    handles: handles,
    get: get, put: put, onSync: onSync, fire: fire, refetchAll: fetchAll, flush: flush,
    isPhotoRef: isPhotoRef, putPhoto: putPhoto, getPhoto: getPhoto, delPhoto: delPhoto,
    signUp: signUp, signIn: signIn, signOut: signOutNow,
    resendConfirm: resendConfirm, resetPassword: resetPassword,
    createMyStudent: createMyStudent, rosterOnce: rosterOnce, refreshRole: refreshRole,
    user: function () { return state.user; },
    isAdmin: function () { return state.isAdmin; },
    mySid: function () { return state.sid; },
    client: function () { return sb; }
  };
})(window);

</script>
