  });
  var mTotal = mental.length;
  var topLevel = SP.LEVELS.slice().sort(function (a, b) { return lvCount[b.n] - lvCount[a.n]; })[0];
  var avgScore = mental.filter(function (r) { return r.score != null; });
  avgScore = avgScore.length ? (avgScore.reduce(function (a, r) { return a + r.score; }, 0) / avgScore.length) : null;

  /* ---- 4. กิจกรรมที่ชอบมากที่สุด (จาก intex6.4) ---- */
  var vMap = {};
  votes.forEach(function (v) { var k = v.activity || '(ไม่ระบุ)'; vMap[k] = (vMap[k] || 0) + 1; });
  extra.forEach(function (x) { var k = x.activity || '(ไม่ระบุ)'; vMap[k] = (vMap[k] || 0) + (Number(x.count) || 0); });
  var vList = SP.sortedEntries(vMap);
  var vTotal = vList.reduce(function (a, e) { return a + e[1]; }, 0);

  function meterRows(items, cls) {
    if (!items.length) return '<p class="text-muted" style="margin:0">ยังไม่มีข้อมูล</p>';
    return items.map(function (it) {
      return '<div class="meter-row"><div class="meter-label"><span>' + SP.esc(it.label) +
        '</span><span class="v">' + SP.esc(it.value) + '</span></div>' +
        '<div class="meter ' + (cls || '') + '"><span style="width:' + Math.max(2, Math.min(100, it.pct)) + '%"></span></div></div>';
    }).join('');
  }

  var cards = [];

  cards.push('<div class="stat"><h3> ปัญหาที่เยอะที่สุด</h3>' +
    (pCounts.length
      ? '<div class="headline">' + SP.esc(pCounts[0][0]) + '</div>' +
        '<div class="sub">แจ้งเข้ามา ' + pCounts[0][1] + ' ครั้ง จากทั้งหมด ' + pTotal + ' ครั้ง (' +
        (pTotal ? (pCounts[0][1] / pTotal * 100).toFixed(1) : '0') + '%)</div>' +
        meterRows(pCounts.slice(0, 5).map(function (e) {
          return { label: e[0], value: e[1] + ' ครั้ง · ' + (pTotal ? (e[1] / pTotal * 100).toFixed(1) : 0) + '%',
                   pct: pTotal ? e[1] / pTotal * 100 : 0 };
        }), 'm-2')
      : '<div class="headline">—</div><div class="sub">ยังไม่มีการแจ้งปัญหา</div>') + '</div>');

  cards.push('<div class="stat"><h3> กิจกรรมที่ใช้งบน้อยที่สุด</h3>' +
    (bAsc.length
      ? '<div class="headline">' + SP.esc(bAsc[0].name) + '</div>' +
        '<div class="sub">จ่ายจริง ' + SP.fmtBaht(bAsc[0].actual) + ' (งบตั้งไว้ ' + SP.fmtBaht(bAsc[0].total) + ')</div>' +
        meterRows(bAsc.slice(0, 5).map(function (r) {
          return { label: r.name, value: SP.fmtBaht(r.actual), pct: bMaxActual ? r.actual / bMaxActual * 100 : 0 };
        }), 'm-1')
      : '<div class="headline">—</div><div class="sub">ยังไม่มีรายการงบประมาณ</div>') + '</div>');

  cards.push('<div class="stat"><h3> สภาพจิตใจคนในโรงเรียนโดยเฉลี่ย</h3>' +
    (mTotal
      ? '<div class="headline">' + SP.esc(topLevel.short) + '</div>' +
        '<div class="sub">พบมากที่สุด ' + lvCount[topLevel.n] + ' คน จาก ' + mTotal + ' คน (' +
        (lvCount[topLevel.n] / mTotal * 100).toFixed(1) + '%)' +
        (avgScore != null ? ' · คะแนนเฉลี่ย ' + avgScore.toFixed(1) + '/50' : '') + '</div>' +
        meterRows(SP.LEVELS.map(function (L) {
          return { label: L.short, value: lvCount[L.n] + ' คน · ' + (lvCount[L.n] / mTotal * 100).toFixed(1) + '%',
                   pct: lvCount[L.n] / mTotal * 100 };
        }), 'm-3')
      : '<div class="headline">—</div><div class="sub">ยังไม่มีผู้ทำแบบประเมิน</div>') + '</div>');

  cards.push('<div class="stat"><h3> กิจกรรมที่นักเรียนชอบมากที่สุด</h3>' +
    (vList.length
      ? '<div class="headline">' + SP.esc(vList[0][0]) + '</div>' +
        '<div class="sub">ได้รับเลือก ' + vList[0][1] + ' คน จากผู้โหวตทั้งหมด ' + vTotal + ' คน (' +
        (vTotal ? (vList[0][1] / vTotal * 100).toFixed(1) : '0') + '%)</div>' +
        meterRows(vList.slice(0, 5).map(function (e) {
          return { label: e[0], value: e[1] + ' คน · ' + (vTotal ? (e[1] / vTotal * 100).toFixed(1) : 0) + '%',
                   pct: vTotal ? e[1] / vTotal * 100 : 0 };
        }))
      : '<div class="headline">—</div><div class="sub">ยังไม่มีการโหวต</div>') + '</div>');

  /* ---- 5. สถานะการแก้ปัญหา ---- */
  var stCount = {};
  SP.STATUSES.forEach(function (s) { stCount[s.k] = 0; });
  problems.forEach(function (r) { var k = r.status || 'wait'; if (stCount[k] != null) stCount[k]++; });
  var doneN = stCount['done'] || 0;
  cards.push('<div class="stat"><h3>🔧 สถานะการแก้ปัญหา</h3>' +
    (pTotal
      ? '<div class="headline">' + (pTotal ? (doneN / pTotal * 100).toFixed(1) : '0.0') + '%</div>' +
        '<div class="sub">แก้ไขเสร็จสิ้นแล้ว ' + doneN + ' จาก ' + pTotal + ' เรื่อง</div>' +
        meterRows(SP.STATUSES.map(function (s) {
          return { label: s.ico + ' ' + s.name, value: stCount[s.k] + ' เรื่อง · ' + (stCount[s.k] / pTotal * 100).toFixed(1) + '%',
                   pct: stCount[s.k] / pTotal * 100 };
        }), 'm-1')
      : '<div class="headline">—</div><div class="sub">ยังไม่มีเรื่องที่แจ้งเข้ามา</div>') + '</div>');

  /* ---- 6. ความพึงพอใจเว็บไซต์ ---- */
  cards.push('<div class="stat"><h3>⭐ ความพึงพอใจต่อเว็บไซต์</h3>' +
    (rateStats.n
      ? '<div class="headline">' + rateStats.avg.toFixed(2) + ' / 5.00</div>' +
        '<div class="sub">จากผู้ให้คะแนน ' + rateStats.n + ' คน</div>' +
        meterRows([5, 4, 3, 2, 1].map(function (v) {
          return { label: v + ' ดาว', value: rateStats.counts[v - 1] + ' คน · ' + (rateStats.counts[v - 1] / rateStats.n * 100).toFixed(1) + '%',
                   pct: rateStats.counts[v - 1] / rateStats.n * 100 };
        }), 'm-2')
      : '<div class="headline">—</div><div class="sub">ยังไม่มีผู้ให้คะแนน</div>') + '</div>');

  document.getElementById('cards').innerHTML = cards.join('');

  /* KPI */
  var totalBudget = bList.reduce(function (a, r) { return a + r.total; }, 0);
  var totalActual = bList.reduce(function (a, r) { return a + r.actual; }, 0);
  var kpis = [
    { l: 'ผู้ร่วมโหวตกิจกรรม', v: SP.fmtNum(vTotal), u: 'คน' },
    { l: 'ผู้ทำแบบประเมินจิตใจ', v: SP.fmtNum(mTotal), u: 'คน' },
    { l: 'ปัญหาที่ได้รับแจ้ง', v: SP.fmtNum(pTotal), u: 'ครั้ง' },
    { l: 'งบประมาณที่ตั้งไว้', v: SP.fmtNum(totalBudget), u: 'บาท' },
    { l: 'งบประมาณที่จ่ายจริง', v: SP.fmtNum(totalActual), u: 'บาท' },
    { l: 'งบประมาณคงเหลือ', v: SP.fmtNum(totalBudget - totalActual), u: 'บาท' },
    { l: 'นักเรียนในคลังรายชื่อ', v: SP.fmtNum(roster.length), u: 'คน' },
    { l: 'ลงทะเบียนเข้าใช้เว็บไซต์', v: SP.fmtNum(students.length), u: 'คน' },
    { l: 'คะแนนเว็บไซต์เฉลี่ย', v: rateStats.n ? rateStats.avg.toFixed(2) : '—', u: rateStats.n ? '/ 5' : '' }
  ];
  document.getElementById('kpis').innerHTML = kpis.map(function (k) {
    return '<div class="stat" style="box-shadow:none;background:var(--surface-2)"><h3 style="font-size:.88rem;margin-bottom:8px">' +
      SP.esc(k.l) + '</h3><div class="headline" style="margin:0">' + k.v +
      ' <span style="font-size:.85rem;font-weight:600;color:var(--ink-muted)">' + k.u + '</span></div></div>';
  }).join('');

  /* ตารางสรุปงบประมาณ */
  var bDesc = bList.slice().sort(function (a, b) { return b.actual - a.actual; });
  document.getElementById('budgetSummary').innerHTML = bDesc.length
    ? bDesc.map(function (r) {
        return '<tr><td>' + SP.esc(r.name) + '</td><td class="num">' + SP.fmtNum(r.total) +
          '</td><td class="num">' + SP.fmtNum(r.actual) + '</td><td class="num">' + SP.fmtNum(r.total - r.actual) +
          '</td><td class="num">' + (r.total ? (r.actual / r.total * 100).toFixed(1) : '—') + '%</td></tr>';
      }).join('')
    : '<tr><td colspan="5" class="text-muted" style="text-align:center;padding:20px">ยังไม่มีข้อมูลงบประมาณ</td></tr>';
  document.getElementById('budgetFoot').innerHTML = bDesc.length
    ? '<tr><td>รวมทั้งสิ้น</td><td class="num">' + SP.fmtNum(totalBudget) + '</td><td class="num">' +
      SP.fmtNum(totalActual) + '</td><td class="num">' + SP.fmtNum(totalBudget - totalActual) +
      '</td><td class="num">' + (totalBudget ? (totalActual / totalBudget * 100).toFixed(1) : '—') + '%</td></tr>' : '';

  /* ตารางสรุปปัญหา */
  document.getElementById('problemSummary').innerHTML = pCounts.length
    ? pCounts.map(function (e, i) {
        var places = SP.sortedEntries(SP.countBy(problems.filter(function (r) { return r.problem === e[0]; }),
          function (r) { return r.place; })).slice(0, 2).map(function (x) { return x[0] + ' (' + x[1] + ')'; }).join(', ');
        return '<tr><td class="num">' + (i + 1) + '</td><td>' + SP.esc(e[0]) + '</td><td class="num">' + e[1] +
          '</td><td class="num">' + (pTotal ? (e[1] / pTotal * 100).toFixed(1) : 0) + '%</td><td>' + SP.esc(places) + '</td></tr>';
      }).join('')
    : '<tr><td colspan="5" class="text-muted" style="text-align:center;padding:20px">ยังไม่มีข้อมูลปัญหา</td></tr>';

  /* ตารางสรุปสภาพจิตใจ */
  document.getElementById('mentalSummary').innerHTML = SP.LEVELS.map(function (L) {
    return '<tr><td><span class="level-badge ' + L.cls + '" style="font-size:.78rem;padding:3px 10px">' + L.short +
      '</span></td><td class="num">' + lvCount[L.n] + '</td><td class="num">' +
      (mTotal ? (lvCount[L.n] / mTotal * 100).toFixed(1) : '0.0') + '%</td></tr>';
  }).join('');

  /* ตารางสรุปผลโหวต */
  document.getElementById('voteSummary').innerHTML = vList.length
    ? vList.map(function (e, i) {
        return '<tr><td class="num">' + (i + 1) + '</td><td>' + SP.esc(e[0]) + '</td><td class="num">' + e[1] +
          '</td><td class="num">' + (vTotal ? (e[1] / vTotal * 100).toFixed(1) : 0) + '%</td></tr>';
      }).join('')
    : '<tr><td colspan="4" class="text-muted" style="text-align:center;padding:20px">ยังไม่มีข้อมูลผลโหวต</td></tr>';

  /* ---- ตารางสรุปสถานะ ---- */
  document.getElementById('statusSummary').innerHTML = pTotal
    ? SP.STATUSES.map(function (s) {
        var inSt = problems.filter(function (r) { return (r.status || 'wait') === s.k; });
        var top = SP.sortedEntries(SP.countBy(inSt, function (r) { return r.problem; }))
          .slice(0, 2).map(function (e) { return e[0] + ' (' + e[1] + ')'; }).join(', ');
        return '<tr><td><span class="status-pill ' + s.cls + '">' + s.ico + ' ' + s.name + '</span></td>' +
          '<td class="num">' + inSt.length + '</td>' +
          '<td class="num">' + (inSt.length / pTotal * 100).toFixed(1) + '%</td>' +
          '<td>' + (SP.esc(top) || '<span class="text-muted">—</span>') + '</td></tr>';
      }).join('')
    : '<tr><td colspan="4" class="text-muted" style="text-align:center;padding:20px">ยังไม่มีข้อมูลปัญหา</td></tr>';

  document.getElementById('sevSummary').innerHTML = pTotal
    ? SP.SEVERITIES.slice().reverse().map(function (sv) {
        var inSv = problems.filter(function (r) { return (+r.severity || 3) === sv.n; });
        var c = {};
        SP.STATUSES.forEach(function (s) {
          c[s.k] = inSv.filter(function (r) { return (r.status || 'wait') === s.k; }).length;
        });
        return '<tr><td><span class="sev-badge ' + sv.cls + '">ระดับ ' + sv.n + ' · ' + sv.name + '</span></td>' +
          '<td class="num">' + inSv.length + '</td>' +
          '<td class="num">' + c.wait + '</td><td class="num">' + c.doing + '</td><td class="num">' + c.done + '</td>' +
          '<td class="num">' + (inSv.length ? (c.done / inSv.length * 100).toFixed(1) + '%' : '—') + '</td></tr>';
      }).join('')
    : '<tr><td colspan="6" class="text-muted" style="text-align:center;padding:20px">ยังไม่มีข้อมูลปัญหา</td></tr>';

  /* ---- ความพึงพอใจเว็บไซต์ ---- */
  (function () {
    var host = document.getElementById('rateSummary');
    if (!rateStats.n) {
      host.innerHTML = '<div class="text-muted">ยังไม่มีผู้ให้คะแนนเว็บไซต์</div>';
    } else {
      var full = Math.round(rateStats.avg), starStr = '';
      for (var i = 1; i <= 5; i++) starStr += '<span class="' + (i <= full ? '' : 'off') + '">★</span>';
      host.innerHTML =
        '<div><div class="rate-big">' + rateStats.avg.toFixed(2) + '</div>' +
          '<div class="stars-static">' + starStr + '</div>' +
          '<div class="text-muted" style="font-size:.82rem;margin-top:4px">จาก ' + rateStats.n + ' คน</div></div>' +
        '<div class="rate-bars">' + [5, 4, 3, 2, 1].map(function (v) {
          var c = rateStats.counts[v - 1], pct = c / rateStats.n * 100;
          return '<div class="rb"><span class="lab">' + v + '★</span>' +
            '<span class="track"><span style="width:' + pct.toFixed(1) + '%"></span></span>' +
            '<span class="cnt">' + c + '</span></div>';
        }).join('') + '</div>';
    }
    document.getElementById('rateTable').innerHTML = ratings.length
      ? ratings.slice().sort(function (a, b) { return (b.iso || '').localeCompare(a.iso || ''); }).map(function (r) {
          var st = '';
          for (var i = 1; i <= 5; i++) st += '<span class="' + (i <= r.stars ? '' : 'off') + '">★</span>';
          return '<tr><td>' + SP.esc(r.name || '—') + '</td><td class="nowrap">' + SP.esc(r.room || '—') + '</td>' +
            '<td class="num nowrap"><span class="stars-static" style="font-size:.9rem">' + st + '</span> ' + r.stars + '</td>' +
            '<td>' + (r.comment ? SP.esc(r.comment) : '<span class="text-muted">—</span>') + '</td>' +
            '<td class="nowrap">' + SP.esc(r.date) + '</td></tr>';
        }).join('')
      : '<tr><td colspan="5" class="text-muted" style="text-align:center;padding:20px">ยังไม่มีผู้ให้คะแนน</td></tr>';
  })();

  document.getElementById('pdfBtn').addEventListener('click', function () { window.print(); });
  }
};

  var view = document.getElementById('view');
  var topbar = document.getElementById('topbar');
  var footer = document.getElementById('siteFooter');
  var timerFloor = 0;

  /* เคลียร์ตัวจับเวลาที่หน้าเดิมตั้งไว้ ไม่ให้ทำงานค้าง */
  function clearTimers() {
    var top = setTimeout(function () { }, 0);
    for (var i = timerFloor; i <= top; i++) { clearTimeout(i); clearInterval(i); }
  }

  function parseHash() {
    var h = String(location.hash || '').replace(/^#/, '');
    if (!h) return { page: HOME, query: '' };
    var i = h.indexOf('?');
    return i < 0 ? { page: h, query: '' } : { page: h.slice(0, i), query: h.slice(i + 1) };
  }

  function render() {
    var r = parseHash();
    if (!PAGES[r.page]) { location.replace('#' + HOME); return; }
    var def = PAGES[r.page];

    clearTimers();
    SP.setRoute(r.page, r.query);

    view.innerHTML = '';
    var tpl = document.getElementById('tpl-' + r.page);
    view.appendChild(tpl.content.cloneNode(true));
    SP.applyImages(view);

    topbar.setAttribute('data-nav', def.nav);
    topbar.setAttribute('data-active', def.active);
    footer.style.display = def.footer ? '' : 'none';
    document.title = def.title;

    SP.rebuildChrome();
    window.scrollTo(0, 0);

    timerFloor = setTimeout(function () { }, 0);
    try { def.init(); } catch (e) { console.error('[' + r.page + ']', e); }
  }

  window.addEventListener('hashchange', render);
  SP.boot(function () { render(); });
})();
</script>
</body>
</html>
