<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ผลการประเมินสภาพจิตใจ | สภานักเรียนโรงเรียนร้องกวางอนุสรณ์</title>
<link rel="icon" href="assets/logo-council.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/stely.css">
</head>
<body>
<header id="topbar" class="topbar" data-nav="student" data-active=""></header>

<main>
<div class="status-page">
  <div class="status-card">
    <div class="check-icon" aria-hidden="true">
      <svg viewBox="0 0 52 52"><path d="M13 27 l9 9 17 -19"/></svg>
    </div>
    <h1>ส่งสำเร็จ</h1>
    <p>ระบบได้รับและประมวลผลแบบประเมินของคุณเรียบร้อยแล้ว</p>
    <p class="status-meta" id="meta"></p>

    <div class="result-box" id="resultBox">
      <div class="result-level">
        <span class="level-badge" id="levelBadge">—</span>
        <span class="score-chip" id="scoreChip">—</span>
      </div>
      <p id="levelDesc" style="margin:10px 0 0;color:var(--ink-2)"></p>
      <hr class="section-divider">
      <div class="advice">
        <h3 style="margin-bottom:.3em"> คำแนะนำสำหรับคุณ</h3>
        <ul id="adviceList"></ul>
      </div>
      <div id="hotline"></div>
    </div>

    <p class="status-meta">แบบประเมินนี้เป็นเครื่องมือคัดกรองเบื้องต้น ไม่ใช่การวินิจฉัยทางการแพทย์
      หากรู้สึกไม่สบายใจ การพูดคุยกับครูแนะแนว ผู้ปกครอง หรือผู้เชี่ยวชาญคือทางเลือกที่ดีเสมอ</p>

    <div class="btn-row" style="justify-content:center">
      <a class="btn btn-primary" href="intex1.html"> กลับหน้าหลัก</a>
      <a class="btn btn-ghost" href="intex3.html">ทำแบบประเมินอีกครั้ง</a>
    </div>
  </div>
</div>
</main>

<footer id="siteFooter" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
SP.boot(function () {
  /* คำแนะนำ 5 ระดับ ตามผลการประเมิน */
  var ADVICE = {
    1: {
      desc: 'สภาพจิตใจของคุณแข็งแรงดีมาก จัดการกับความเครียดในชีวิตประจำวันได้ดี',
      items: [
        'รักษาสมดุลระหว่างการเรียน การพักผ่อน และกิจกรรมที่ชอบแบบนี้ต่อไป',
        'นอนหลับให้เพียงพอวันละ 8-9 ชั่วโมง และกินอาหารครบ 5 หมู่',
        'ออกกำลังกายหรือเล่นกีฬาอย่างน้อยสัปดาห์ละ 3 วัน',
        'ชวนเพื่อนที่ดูเงียบหรือแยกตัวมาร่วมกิจกรรม — พลังบวกของคุณช่วยคนอื่นได้'
      ]
    },
    2: {
      desc: 'โดยรวมสภาพจิตใจอยู่ในเกณฑ์ดี มีความเครียดบ้างตามปกติของวัยเรียน',
      items: [
        'จัดตารางเวลาเรียนและเวลาพักให้ชัดเจน ไม่หักโหมจนเกินไป',
        'ฝึกหายใจเข้า-ออกลึก ๆ 5 นาทีเมื่อรู้สึกตึงเครียด',
        'พูดคุยกับเพื่อนสนิทหรือคนในครอบครัวเมื่อมีเรื่องไม่สบายใจ',
        'ลดการใช้โทรศัพท์ก่อนนอนอย่างน้อย 30 นาที เพื่อให้หลับได้ลึกขึ้น'
      ]
    },
    3: {
      desc: 'เริ่มมีสัญญาณความเครียดที่ควรใส่ใจดูแล ยังจัดการได้ด้วยตนเองหากเริ่มปรับตั้งแต่ตอนนี้',
      items: [
        'ลองบันทึกอารมณ์ประจำวันสั้น ๆ เพื่อสังเกตว่าอะไรทำให้รู้สึกแย่หรือดีขึ้น',
        'แบ่งงานหรือการบ้านเป็นชิ้นเล็ก ๆ ทำทีละอย่าง จะรู้สึกกดดันน้อยลง',
        'เล่าความรู้สึกให้คนที่ไว้ใจฟัง เช่น ครูที่ปรึกษา เพื่อนสนิท หรือผู้ปกครอง',
        'จัดเวลาให้กับสิ่งที่ทำแล้วมีความสุขอย่างน้อยวันละ 30 นาที',
        'หากอาการยังไม่ดีขึ้นภายใน 2 สัปดาห์ ควรเข้าพบครูแนะแนว'
      ]
    },
    4: {
      desc: 'มีสัญญาณความเครียดค่อนข้างสูง ควรได้รับการดูแลและมีคนช่วยรับฟังอย่างใกล้ชิด',
      items: [
        'แนะนำให้เข้าพบครูแนะแนวหรือครูที่ปรึกษาภายในสัปดาห์นี้',
        'บอกเล่าความรู้สึกกับผู้ปกครองหรือผู้ใหญ่ที่ไว้ใจ ไม่ต้องเก็บไว้คนเดียว',
        'พยายามไม่อยู่คนเดียวเป็นเวลานานเมื่อรู้สึกแย่ อยู่ใกล้คนที่รู้สึกปลอดภัยด้วย',
        'รักษาเวลานอนและมื้ออาหารให้เป็นเวลา เพราะร่างกายกับจิตใจเชื่อมโยงกัน',
        'งดใช้สารหรือพฤติกรรมที่ทำร้ายตัวเองเพื่อระบายความรู้สึก'
      ],
      hotline: true
    },
    5: {
      desc: 'ผลประเมินอยู่ในระดับที่ควรได้รับความช่วยเหลือจากผู้เชี่ยวชาญโดยเร็ว คุณไม่ได้อยู่คนเดียว และเรื่องนี้ดีขึ้นได้',
      items: [
        'ควรเข้าพบครูแนะแนว นักจิตวิทยาโรงเรียน หรือแพทย์โดยเร็วที่สุด',
        'แจ้งผู้ปกครองหรือผู้ใหญ่ที่ไว้ใจให้ทราบ เพื่อพาไปพบผู้เชี่ยวชาญ',
        'หากมีความคิดทำร้ายตัวเอง ให้บอกผู้ใหญ่ที่อยู่ใกล้ทันที และอย่าอยู่คนเดียว',
        'จดชื่อคนที่โทรหาได้ยามฉุกเฉินไว้ในโทรศัพท์ อย่างน้อย 2 คน'
      ],
      hotline: true
    }
  };

  if (!SP.Student.guard()) return;

  var id = new URLSearchParams(location.search).get('id');
  var all = SP.list(SP.KEY.MENTAL);
  var rec = null;
  for (var i = all.length - 1; i >= 0; i--) { if (!id || all[i].id === id) { rec = all[i]; break; } }
  if (!rec && all.length) rec = all[all.length - 1];

  if (!rec) {
    document.getElementById('resultBox').innerHTML =
      '<p style="margin:0">ไม่พบข้อมูลการประเมิน กรุณา <a href="intex3.html">ทำแบบประเมิน</a> ก่อน</p>';
    document.getElementById('meta').textContent = '';
    return;
  }

  var lv = SP.levelOf(rec.score);
  var a = ADVICE[lv.n];

  document.getElementById('meta').textContent =
    'ผู้ทำแบบประเมิน: ' + rec.name + ' (' + rec.room + ' เลขที่ ' + rec.no + ') · ' + rec.date + ' เวลา ' + rec.time;

  var badge = document.getElementById('levelBadge');
  badge.className = 'level-badge ' + lv.cls;
  badge.textContent = 'ผลการประเมิน: ' + lv.short;
  document.getElementById('scoreChip').textContent = 'คะแนนรวม ' + rec.score + ' / 50';
  document.getElementById('levelDesc').textContent = a.desc;
  document.getElementById('adviceList').innerHTML = a.items.map(function (t) {
    return '<li>' + SP.esc(t) + '</li>';
  }).join('');

  if (a.hotline) {
    document.getElementById('hotline').innerHTML =
      '<div class="callout ' + (lv.n === 5 ? 'danger' : 'warn') + '" style="margin-top:16px">' +
      '📞 <strong>ขอความช่วยเหลือได้ตลอด 24 ชั่วโมง</strong><br>' +
      'สายด่วนสุขภาพจิต <strong>1323</strong> (กรมสุขภาพจิต) โทรฟรี · กรณีฉุกเฉินถึงชีวิต โทร <strong>1669</strong><br>' +
      'หรือเดินเข้าไปคุยกับครูแนะแนวของโรงเรียนได้ทุกวันทำการ</div>';
  }
});
</script>
</body>
</html>
